    <p class="rules">${M.rules}</p>
    <div class="players">${L.players.map((p,i)=>`<div class="pc" style="--pcol:${COLORS[i%8]}"><div class="nm"><span>${esc(p.name)}${p.remote===net.token?" (du)":""}</span>${p.remote&&!on.includes(p.remote)?'<span class="badge">getrennt</span>':typeLabel(p)}</div></div>`).join("")}</div>
    ${banner||`<div class="waitmsg"><span class="pulse"></span>${me?"Warte, bis der Host das Spiel startet.":"Du schaust zu. Warte auf den Spielstart."}</div>`}
  </section>${net.tour?`<div class="lobbytour">${renderTourRO(net.tour)}</div>`:""}`;
}

function dslot(d){if(!d)return`<div class="dslot"><span class="k">–</span></div>`;return`<div class="dslot filled ${!d.n?"miss":"d"+d.m}"><span class="v">${lbl(d)}</span><span class="k">${val(d)}</span></div>`}

function renderGame(){
  const M=MODES[g.mode],p=g.players[g.cur],h=M.hero(g,p),tg=M.targets?M.targets(g,p):null;
  const mine=canInput(p);
  const roundInfo=M.round?M.round(g):`Runde ${g.round}`;
  const hasSum=!!M.visit,im=inputMode==="sum"&&!hasSum?"keys":inputMode,info=M.visitInfo?M.visitInfo(g,p):null;
  const sumpad=`<div class="sumdisp" aria-live="polite"><span class="label">Aufnahme</span><b>${sumBuf||"0"}</b></div>
    <div class="quick">${[26,41,45,60,81,85,100,140].map(v=>`<button data-sumq="${v}">${v}</button>`).join("")}</div>
    <div class="keys numpad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-num="${n}">${n}</button>`).join("")}<button data-num="del" class="undo" aria-label="Ziffer löschen">⌫</button><button data-num="0">0</button><button data-num="ok" class="okbtn">OK</button></div>
    <div class="boardrow">${info&&info.opened&&info.rest<=170&&checkout(info.rest,3,info.out)?`<button class="btn" id="sumrest">Check ${info.rest}</button>`:""}<button class="btn" id="sumzero">Kein Score</button><button class="btn" id="undo" ${(isGuest()?net.canUndo:hist.length>0)?"":"disabled"}>↶ Zurück</button></div>`;
  const strip=`<div class="strip">${g.players.map((q,i)=>{const c=M.card(g,q);const tag=q.bot?'<span class="badge gold">Bot</span>':q.owner&&net.role?(q.owner===net.token?'<span class="badge blue">Du</span>':(net.role==="host"?net.conns[q.owner]:(net.online||[]).includes(q.owner))?'<span class="badge blue">Online</span>':'<span class="badge">Offline</span>'):"";return`<div class="pc ${i===g.cur?"active":""} ${q.out?"out":""}" style="--pcol:${q.color}"><div class="nm"><span>${esc(q.name)}</span>${c.legs?`<span class="legs">${Array.from({length:g.opts.legs},(_,k)=>`<i class="${k<q.legs?"on":""}"></i>`).join("")}</span>`:tag}</div><div class="big">${c.big}</div><div class="sub">${c.sub}</div>${c.prog!=null?`<div class="progress"><span style="width:${c.prog*100}%"></span></div>`:""}</div>`}).join("")}</div>`;
  const last=g.last?`Letzte Aufnahme · <b style="color:${g.last.color}">${esc(g.last.name)}</b>: ${g.last.darts.map(lbl).join(" ")}${g.last.bust?" · <b style='color:var(--red-t)'>überworfen</b>":` · <b>${g.last.total}</b>`}`:"Erster Wurf. Viel Glück.";
  const hl=n=>tg&&((tg.nums&&tg.nums.includes(n))||(tg.list&&tg.list.some(x=>x.n===n)))?"target":"";
  const undoOk=isGuest()?net.canUndo:hist.length>0;
  const keys=`<div class="mods" role="group" aria-label="Multiplikator"><button class="m1" data-mult="1" aria-pressed="${mult===1}">Single</button><button class="m2" data-mult="2" aria-pressed="${mult===2}">Double</button><button class="m3" data-mult="3" aria-pressed="${mult===3}">Triple</button></div>
    <div class="keys">${Array.from({length:20},(_,i)=>`<button data-k="${i+1}" class="${hl(i+1)}">${i+1}</button>`).join("")}
    <button class="bull ${hl(25)}" data-k="25" ${mult===3?"disabled":""}>${mult===2?"Bull":"25"}</button><button class="miss" data-k="0">Miss</button><button class="wide" id="fill" title="Restliche Darts als Miss werten">Weiter</button><button class="undo" id="undo" ${undoOk?"":"disabled"} aria-label="Zurück">↶</button></div>`;
  const board=`<div class="boardwrap">${boardSVG(tg,g.turn,g.last)}<div class="boardrow"><button class="btn" id="miss2">Miss</button><button class="btn" id="fill">Weiter</button><button class="btn" id="undo" ${undoOk?"":"disabled"}>↶ Zurück</button></div></div>`;
  const ownerOff=p.owner&&p.owner!==net.token&&!(net.role==="host"?net.conns[p.owner]:(net.online||[]).includes(p.owner));
  const amSpect=isGuest()&&!g.players.some(q=>q.owner===net.token);
  const wait=net.role==="reconnecting"?`<div class="waitmsg"><span class="pulse"></span>${esc(net.status||"Verbinde neu …")}</div>`:
    mine?(ownerOff&&net.role==="host"?`<div class="waitmsg"><span class="pulse"></span>${esc(p.name)} ist offline. Du kannst für ${esc(p.name)} eintragen.</div>`:""):
    p.bot?`<div class="waitmsg"><span class="pulse"></span>${esc(p.name)} wirft …</div>`:
    amSpect?`<div class="waitmsg"><span class="pulse"></span>Du schaust zu. ${esc(p.name)} ist dran.</div>`:
    ownerOff?`<div class="waitmsg"><span class="pulse"></span>${esc(p.name)} ist offline. Der Host kann eintragen.</div>`:
    `<div class="waitmsg"><span class="pulse"></span>${esc(p.name)} ist dran und trägt auf dem eigenen Gerät ein.</div>`;
  const hostUndo=!mine&&!isGuest()&&hist.length?`<button class="btn small" id="undo">↶ Zurück</button>`:"";
  return topbar(`<button class="btn small" id="tvBtn" aria-pressed="${tvMode}">${tvMode?"Normale Ansicht":"Großanzeige"}</button><button class="btn small" id="quit">${isGuest()?"Verlassen":"Beenden"}</button>`)+`
  <div class="gamehead"><div><div class="title">${M.name}</div><div class="meta"><span class="label">${M.sub(g)}</span><span class="label" style="color:var(--fg)">${roundInfo}</span></div></div></div>
  ${strip}
  <div class="play">
    <section class="active-panel" style="--pcol:${p.color}">
      <div class="who"><span class="dot" style="background:${p.color}"></span>${esc(p.name)} ist dran<span class="badge" style="margin-left:auto">Dart ${Math.min(3,g.turn.length+1)}/3</span></div>
      <div class="hero">${h.v}<small>${h.sm}</small></div>
      <div class="darts">${[0,1,2].map(i=>dslot(g.turn[i])).join("")}</div>
      <div class="hint">${M.hint(g,p)}</div>
      ${M.board?M.board(g):""}
      <div class="last">${last}</div>
    </section>
    <section class="input ${mine?"":"locked"}">
      <div class="inhead"><span class="label">Eingabe</span><div class="seg"><button data-input="keys" aria-pressed="${im==="keys"}">Einzeln</button><button data-input="board" aria-pressed="${im==="board"}">Scheibe</button>${hasSum?`<button data-input="sum" aria-pressed="${im==="sum"}">Summe</button>`:""}</div></div>
      ${wait}${hostUndo?`<div>${hostUndo}</div>`:""}
      ${im==="board"?board:im==="sum"&&!g.turn.length?sumpad:keys}
    </section>
  </div>`;
}

function renderResult(){
  const M=MODES[g.mode],ws=(g.winList||[]).map(i=>g.players[i]);
  const title=ws.length===1?esc(ws[0].name):ws.length>1?"Unentschieden":"Spiel beendet";
  const sorted=g.players.slice().sort((a,b)=>(ws.includes(b)-ws.includes(a)));
  const btns=g.tour&&!guestish()?`<button class="btn primary start" id="toTour">${(g.winList||[]).length===1||tour&&tour.type==="league"?"Weiter zum Turnier":"Unentschieden: nochmal spielen"}</button><button class="btn start" id="undoEnd" ${hist.length?"":"disabled"} style="font-size:18px">Letzten Dart zurück</button>`:guestish()?`<div class="waitmsg"><span class="pulse"></span>Warte auf den Host (Revanche oder neues Spiel).</div><button class="btn start" id="leave" style="font-size:18px">Raum verlassen</button>`:
    `<button class="btn primary start" id="again">Revanche</button><button class="btn start" id="undoEnd" ${hist.length?"":"disabled"} style="font-size:18px">Letzten Dart zurück</button><button class="btn start" id="menu" style="font-size:18px">Neues Spiel</button>`;
  return topbar()+`<div class="result">
  <section class="winner"><svg width="120" height="120" viewBox="-60 -60 120 120" aria-hidden="true">${[56,44,32,20,9].map((r,i)=>`<circle r="${r}" fill="${["var(--b-dark)","var(--b-red)","var(--b-light)","var(--b-green)","var(--b-red)"][i]}"/>`).join("")}</svg>
    <span class="crown">${ws.length===1?"Sieger":"Ergebnis"} · ${M.name}</span><div class="wn" ${ws.length===1?`style="color:${ws[0].color}"`:""}>${title}</div>
    <span class="label">${M.sub(g)}${ws.length>1?" · "+ws.map(w=>esc(w.name)).join(" & "):""}</span></section>
  <section class="card"><h2>Statistik</h2><div class="tscroll"><table class="stats"><thead><tr><th>Spieler</th>${M.stats.map(s=>`<th>${s[0]}</th>`).join("")}<th>Darts</th></tr></thead><tbody>${sorted.map(p=>`<tr class="${ws.includes(p)?"win":""}"><td><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${p.color};margin-right:8px"></span>${esc(p.name)}${p.bot?" · Bot":""}</td>${M.stats.map(s=>`<td>${s[1](p)}</td>`).join("")}<td>${p.darts}</td></tr>`).join("")}</tbody></table></div></section>
  ${(g.newAch||[]).length?`<section class="card newach"><h2>Neu freigeschaltet</h2>${g.newAch.map(n=>`<div class="setrow"><b>${esc(n.name)}</b><span>${n.list.map(esc).join(" · ")}</span></div>`).join("")}</section>`:""}
  ${M.resultExtra?M.resultExtra(g):""}
  <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center">${btns}</div>
  ${mon.enabled&&!mon.adsRemoved&&!guestish()?`<p class="foot">Nach dem Spiel kommt kurz Werbung. <button class="linkbtn" id="buyNoAds">Werbung für ${monPrice()} entfernen</button></p>`:""}</div>`;
}

function render(){
  const app=$("#app");
  document.body.classList.toggle("tv",view==="game"&&tvMode);
  const ae=document.activeElement,fid=ae&&ae.id&&ae.tagName==="INPUT"?ae.id:null,sel=fid?[ae.selectionStart,ae.selectionEnd]:null;
  app.innerHTML=view==="stats"?renderStats():view==="setup"?renderSetup():view==="lobby"?renderLobby():view==="game"&&g?renderGame():g?renderResult():renderLobby();
  if(fid){const el=document.getElementById(fid);if(el){el.focus();try{el.setSelectionRange(sel[0],sel[1])}catch(e){}}}
  if(net.role==="host")broadcast(syncPayload());
  if(net.role==="host"||net.role==="guest")saveSession();
  scheduleBot();
}

/* ================= Events ================= */
function saveCfg(){if(isGuest())return;store.set("oche.cfg",{mode:cfg.mode,opts:cfg.opts,players:cfg.players.filter(p=>!p.remote)})}
document.addEventListener("click",e=>{
  const t=e.target.closest("button,[data-n],[data-miss]");if(!t||t.disabled)return;
  if(t.id==="langBtn"){setLang(lang==="de"?"en":"de");return}
  if(t.id==="buyNoAds"){try{window.AndroidTTS.buyNoAds()}catch(e){}return}
  if(t.id==="adPrivacy"){try{window.AndroidTTS.adPrivacy()}catch(e){}return}
  if(t.id==="sound"){sound=!sound;store.set("oche.sound",sound);render();return}
  if(t.id==="caller"){openCaller();return}
  if(t.id==="leave"){leaveRoom();return}
  if(t.id==="share"){shareCode();return}
  if(t.dataset.tab&&view==="setup"){tab=t.dataset.tab;modePicker=false;statsConfirm=false;render();window.scrollTo(0,0);return}
  if(view==="setup"){
    if(t.dataset.themeSet){themePref=t.dataset.themeSet;store.set("oche.theme",themePref);applyTheme();render();return}
    if(t.id==="updCheck"){checkUpdate(true);return}
    if(t.id==="updSkip"){store.set("oche.updskip",update&&update.version);render();return}
    if(t.id==="pwaInstall"&&installEvt){installEvt.prompt();installEvt.userChoice.finally(()=>{installEvt=null;render()});return}
    if(t.id==="vibBtn"){vibOn=!vibOn;store.set("oche.vib",vibOn);if(vibOn)buzz(40);render();return}
    if(t.dataset.prefdbl!=null){PREF_DBL=+t.dataset.prefdbl;store.set("oche.prefdbl",PREF_DBL);coCache.clear();render();return}
    if(t.id==="bkExport"){exportBackup();return}
    if(t.id==="bkImport"){const f=$("#bkFile");f.value="";f.click();return}
    if(t.dataset.tourtype){tourType=t.dataset.tourtype;store.set("oche.tourtype",tourType);render();return}
    if(t.id==="tourNew"){tourCreate();return}
    if(t.dataset.tm!=null){tourStart(+t.dataset.tm);return}
    if(t.id==="tourEnd"){if(tour&&tour.champion!=null){tour=null;saveTour();render()}else{tourConfirm=true;render()}return}
    if(t.id==="tourNo"){tourConfirm=false;render();return}
    if(t.id==="tourYes"){tour=null;tourConfirm=false;saveTour();render();return}
  }
  if(view==="setup"&&t.dataset.input){inputMode=t.dataset.input;store.set("oche.input",inputMode);render();return}
  if(view==="setup"&&tab==="stats"||view==="stats"){
    if(t.id==="statsBack"){view="setup";statsConfirm=false;render();return}
    if(t.dataset.prof){statsSel=t.dataset.prof;statsConfirm=false;render();return}
    if(t.id==="profDel"){statsConfirm=true;render();return}
    if(t.id==="profNo"){statsConfirm=false;render();return}
    if(t.id==="profYes"){const all=statsAll(),k=statsSel&&all[statsSel]?statsSel:Object.keys(all).sort((a,b)=>all[b].games.length-all[a].games.length)[0];delete all[k];store.set("oche.stats",all);statsSel=null;statsConfirm=false;render();return}
  }
  if(view==="setup"){
    if(t.id==="dailyGo"){const D=dailyTask();cfg.mode=D.mode;cfg.opts[D.mode]=Object.assign({},cfg.opts[D.mode]||{},D.opts);saveCfg();render();return}
    if(t.id==="modePick"){modePicker=true;render();window.scrollTo(0,0);return}
    if(t.id==="modeClose"){modePicker=false;render();return}
    if(t.id==="optsToggle"){optsOpen=!optsOpen;render();return}
    if(t.dataset.mode){cfg.mode=t.dataset.mode;modePicker=false;saveCfg();render();window.scrollTo(0,0);return}
    if(t.dataset.opt){cfg.opts[cfg.mode]=cfg.opts[cfg.mode]||{};cfg.opts[cfg.mode][t.dataset.opt]=JSON.parse(t.dataset.val);saveCfg();render();return}
    if(t.id==="addp"){cfg.players.push({name:"Spieler "+(cfg.players.length+1),bot:0});saveCfg();render();const i=$("#pn"+(cfg.players.length-1));i&&i.select();return}
    if(t.id==="addbot"){const n=cfg.players.filter(p=>p.bot).length;cfg.players.push({name:n?"Bot "+(n+1):"Bot",bot:3});saveCfg();render();return}
    if(t.dataset.del){const i=+t.dataset.del,p=cfg.players[i];if(p.remote&&net.conns[p.remote]){try{net.conns[p.remote].close()}catch(e){}}cfg.players.splice(i,1);saveCfg();render();return}
    if(t.dataset.up){const i=+t.dataset.up;[cfg.players[i-1],cfg.players[i]]=[cfg.players[i],cfg.players[i-1]];saveCfg();render();return}
    if(t.id==="shuf"){cfg.players.sort(()=>Math.random()-.5);saveCfg();render();return}
    if(t.id==="go"){startGame();return}
    if(t.id==="hostRoom"){hostRoom();return}
    if(t.id==="copyLink"){copyLink();return}
    if(t.id==="joinRoom"){invite=null;joinRoom($("#joinCode").value,$("#joinName").value,$("#joinSpect").checked);return}
    if(t.id==="closeRoom"){closeRoom("",net.role==="host");return}
  }
  if(view==="game"){
    if(t.id==="tvBtn"){tvMode=!tvMode;store.set("oche.tv",tvMode);render();return}
    if(t.dataset.input){inputMode=t.dataset.input;store.set("oche.input",inputMode);render();return}
    if(t.id==="quit"){confirmQuit();return}
    if(net.role==="reconnecting")return;
    if(t.id==="undo"){if(isGuest())guestSend({t:"undo"});else undo();return}
    if(!canInput(g.players[g.cur]))return;
    if(t.closest("#board")){boardHit(e);return}
    if(t.dataset.mult){const m=+t.dataset.mult;mult=mult===m?1:m;render();return}
    if(t.dataset.sumq){submitSum(+t.dataset.sumq);return}
    if(t.dataset.num){const v=t.dataset.num;if(v==="del")sumBuf=sumBuf.slice(0,-1);else if(v==="ok"){if(sumBuf!=="")submitSum(+sumBuf);return}else if(sumBuf.length<3)sumBuf=(sumBuf+v).replace(/^0+(?=\d)/,"");render();return}
    if(t.id==="sumzero"){submitSum(0);return}
    if(t.id==="sumrest"){const M=MODES[g.mode],i=M.visitInfo(g,g.players[g.cur]);submitSum(i.rest);return}
    if(t.dataset.k!=null){const n=+t.dataset.k;input(n?{n,m:n===25?Math.min(mult,2):mult}:{n:0,m:0});return}
    if(t.id==="miss2"){input({n:0,m:0});return}
    if(t.id==="fill"){if(isGuest())guestSend({t:"fill"});else fillTurn();return}
  }
  if(view==="result"&&!isGuest()){
    if(t.id==="toTour"||t.id==="again"||t.id==="menu")adAfterGame();
    if(t.id==="toTour"){const again=g.tour&&tour&&tour.type==="ko"&&(g.winList||[]).length!==1;const mid=g.tour&&g.tour.mid;if(again){tourStart(mid);return}view="setup";tab="tour";g=null;render();window.scrollTo(0,0);return}
    if(t.id==="again"){startGame();return}
    if(t.id==="menu"){view="setup";g=null;render();return}
    if(t.id==="undoEnd"){undo();return}
  }
});
document.addEventListener("change",e=>{if(e.target.id==="bkFile"){const f=e.target.files&&e.target.files[0];if(!f)return;const fr=new FileReader();fr.onload=()=>importBackup(String(fr.result||""));fr.readAsText(f);return}if(e.target.dataset.optnum){const x=MODES[cfg.mode].options.find(o=>o.k===e.target.dataset.optnum),v=parseInt(e.target.value,10);if(x&&x.custom&&v>=x.custom.min&&v<=x.custom.max){cfg.opts[cfg.mode]=cfg.opts[cfg.mode]||{};cfg.opts[cfg.mode][x.k]=v;saveCfg()}else toastLocal(`Bitte eine Zahl von ${x.custom.min} bis ${x.custom.max}`,"red");render();return}if(e.target.dataset.bot!=null){const i=+e.target.dataset.bot,p=cfg.players[i],b=+e.target.value;if(b&&/^Spieler \d+$/.test(p.name))p.name="Bot";if(!b&&/^Bot( \d+)?$/.test(p.name))p.name="Spieler "+(i+1);p.bot=b;saveCfg();render()}});
document.addEventListener("input",e=>{if(e.target.dataset.pi!=null){cfg.players[+e.target.dataset.pi].name=e.target.value;saveCfg();if(net.role==="host")broadcast(syncPayload())}});
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target.id==="joinCode"){joinRoom($("#joinCode").value,$("#joinName").value,$("#joinSpect").checked);return}
  if(view!=="game"||e.target.tagName==="INPUT"||$(".overlay")||!g||!canInput(g.players[g.cur]))return;
  const k=e.key.toLowerCase();
  if(inputMode==="sum"&&MODES[g.mode].visit&&!g.turn.length){
    if(/^[0-9]$/.test(k)){if(sumBuf.length<3)sumBuf=(sumBuf+k).replace(/^0+(?=\d)/,"");render();return}
    if(k==="enter"){if(sumBuf!=="")submitSum(+sumBuf);return}
    if(k==="backspace"&&sumBuf){e.preventDefault();sumBuf=sumBuf.slice(0,-1);render();return}
  }
  if(k==="d"){mult=mult===2?1:2;render()}else if(k==="t"){mult=mult===3?1:3;render()}else if(k==="s"){mult=1;render()}
  else if(k==="0"||k==="m"){input({n:0,m:0})}else if(k==="b"){input({n:25,m:Math.min(mult,2)})}
  else if(k==="backspace"){e.preventDefault();if(isGuest())guestSend({t:"undo"});else undo()}
});
function confirmQuit(){
  const guest=guestish();
  const o=document.createElement("div");o.className="overlay";o.innerHTML=`<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="qt"><h3 id="qt">${guest?"Raum verlassen?":"Spiel beenden?"}</h3><p class="rules">${guest?"Du verlässt das Online-Spiel.":"Der aktuelle Spielstand geht verloren."}</p><div class="row"><button class="btn" id="qno">Weiterspielen</button><button class="btn primary" id="qyes">${guest?"Verlassen":"Beenden"}</button></div></div>`;
  document.body.appendChild(o);$("#qno").focus();
  o.addEventListener("click",e=>{e.stopPropagation();if(e.target.id==="qyes"){if(guest)leaveRoom();else{view="setup";g=null;render()}}if(e.target.id==="qyes"||e.target.id==="qno"||e.target===o)o.remove()});
}
/* Android back button */
window.ocheBack=function(){
  if(view==="stats"&&!$(".overlay")){view="setup";render();return true}
  if(view==="setup"&&!$(".overlay")&&(modePicker||tab!=="play")){modePicker=false;tab="play";render();return true}
  const ov=$(".overlay");if(ov){ov.remove();return true}
  if(view==="game"){confirmQuit();return true}
  if(view==="result"&&!isGuest()){view="setup";g=null;render();return true}
  if(guestish()||view==="lobby"){leaveRoom();return true}
  if(net.role){closeRoom("",net.role==="host");return true}
  return false;
};
resumeSession();
inviteFromHash();
render();
})();

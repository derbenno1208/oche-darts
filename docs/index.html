<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}button,a{-webkit-tap-highlight-color:transparent}</style>
<title>Oche Dart Counter</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="fonts.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0d1512">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Oche">
<meta name="description" content="Oche Darts: Dart-Zähler mit 12 Spielmodi, Online-Spiel, Turnieren und Profi-Caller.">
<script src="peerjs.min.js"></script>
<style>
/* Layout: scoreboard strip on top, active-player panel + input pad (keypad or clickable board) side by side, stacking on phones */
:root{
  --bg:#0d1512; --panel:#141f1b; --panel2:#1a2823; --line:#26372f;
  --fg:#f1e9d6; --muted:#97a69d; --faint:#5f7068;
  --red:#d9473b; --green:#2f9e5f; --gold:#e6b34a;
  --b-dark:#1c1f1d; --b-light:#e9dcbd; --b-red:#c8392e; --b-green:#1f7f4b; --b-wire:#9aa39e;
  --f-display:"Big Shoulders Display","Oswald","Arial Narrow",Impact,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-label:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --red-t:var(--red-t); --green-t:var(--green-t); --blue-t:var(--blue-t); --hover:var(--hover); --hover-line:var(--hover-line); --tint:var(--tint);
  --r:14px;
  color-scheme:dark;
}
/* Helles Design: folgt der Systemeinstellung, lässt sich in den Optionen festlegen */
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#eef1ec; --panel:#ffffff; --panel2:#e4e9e4; --line:#cbd5cd; --fg:#16211c; --muted:#56645c; --faint:#8b978f;
  --red:#cf3b2f; --green:#1f8a50; --gold:#a8730c; --red-t:#b3261e; --green-t:#13703c; --blue-t:#245ea6; --hover:#dfe6e0; --hover-line:#aebcb3; --tint:rgba(0,0,0,.035);
  color-scheme:light}}
:root[data-theme="light"]{
  --bg:#eef1ec; --panel:#ffffff; --panel2:#e4e9e4; --line:#cbd5cd; --fg:#16211c; --muted:#56645c; --faint:#8b978f;
  --red:#cf3b2f; --green:#1f8a50; --gold:#a8730c; --red-t:#b3261e; --green-t:#13703c; --blue-t:#245ea6; --hover:#dfe6e0; --hover-line:#aebcb3; --tint:rgba(0,0,0,.035);
  color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(47,158,95,.10), transparent 60%),radial-gradient(900px 500px at -10% 110%, rgba(217,71,59,.08), transparent 60%);
  background-attachment:fixed}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-block:18px 40px;display:flex;flex-direction:column;gap:20px}
.label{font-family:var(--f-label);text-transform:uppercase;letter-spacing:.09em;font-size:12.5px;color:var(--muted);font-weight:600}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:34px;height:34px;flex:none}
.brand h1{font-family:var(--f-display);font-weight:900;font-size:30px;letter-spacing:.02em;margin:0;line-height:1;text-transform:uppercase}
.brand h1 span{color:var(--red)}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);padding:9px 14px;border-radius:10px;font-weight:600;display:inline-flex;align-items:center;gap:8px;transition:background .15s,border-color .15s,transform .05s}
.btn:hover{background:var(--panel2);border-color:var(--hover-line)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.primary:hover{background:#e65548}
.btn.ghost{background:transparent}
.btn.small{padding:6px 10px;font-size:13px}
.btn[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}

/* ---------- Setup ---------- */
.setup{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.setup{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card h2{font-family:var(--f-display);font-weight:800;font-size:22px;text-transform:uppercase;letter-spacing:.03em;margin:0;line-height:1.1}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.mode{all:unset;cursor:pointer;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 13px;display:flex;flex-direction:column;gap:4px;position:relative;transition:border-color .15s,background .15s}
.mode:hover{border-color:var(--hover-line)}
.mode:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.mode[aria-checked="true"]{border-color:var(--red);background:linear-gradient(180deg,rgba(217,71,59,.12),rgba(217,71,59,.03))}
.mode b{font-family:var(--f-display);font-size:21px;font-weight:800;text-transform:uppercase;letter-spacing:.02em;line-height:1.05}
.mode small{color:var(--muted);font-size:13px;line-height:1.35}
.mode .tag{position:absolute;top:10px;right:10px;font-family:var(--f-label);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.rules{color:var(--muted);font-size:14px;max-width:65ch;margin:0;border-left:2px solid var(--line);padding-left:12px}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{display:flex;flex-direction:column;gap:6px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--bg);padding:7px 12px;border-radius:9px;font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.players{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;gap:8px;align-items:center}
.prow .dot{width:12px;height:12px;border-radius:50%;flex:none}
.prow input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 11px}
.prow input:focus{border-color:var(--gold);outline:none}
.iconbtn{border:1px solid var(--line);background:var(--bg);width:38px;height:38px;border-radius:9px;display:grid;place-items:center;flex:none;color:var(--muted)}
.iconbtn:hover{color:var(--fg);border-color:var(--hover-line)}
.iconbtn:disabled{opacity:.35;cursor:default}
.start{font-family:var(--f-display);font-size:24px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;padding:14px 18px;justify-content:center}

/* ---------- Game ---------- */
.gamehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.gamehead .title{font-family:var(--f-display);font-weight:900;font-size:34px;text-transform:uppercase;line-height:1;letter-spacing:.02em}
.gamehead .meta{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.pc{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden;transition:border-color .2s,transform .2s;min-width:0}
.pc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--pcol,var(--faint));opacity:.5}
.pc.active{border-color:var(--pcol);box-shadow:0 0 0 1px var(--pcol),0 10px 30px -14px var(--pcol)}
.pc.active::before{opacity:1}
.pc.out{opacity:.45}
.pc .nm{display:flex;justify-content:space-between;gap:8px;align-items:center;font-weight:700;font-size:15px}
.pc .nm span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc .big{font-family:var(--f-display);font-weight:900;font-size:52px;line-height:.9;font-variant-numeric:tabular-nums}
.pc .sub{display:flex;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.legs{display:flex;gap:4px}
.legs i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--muted)}
.legs i.on{background:var(--gold);border-color:var(--gold)}
.badge{font-family:var(--f-label);font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:var(--panel2);color:var(--muted);white-space:nowrap}
.badge.red{background:rgba(217,71,59,.18);color:var(--red-t)}
.badge.gold{background:rgba(230,179,74,.16);color:var(--gold)}
.badge.green{background:rgba(47,158,95,.18);color:var(--green-t)}

.play{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px;align-items:start}
@media (max-width:860px){.play{grid-template-columns:1fr}}
.active-panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:16px;position:relative;overflow:hidden}
.active-panel .who{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px}
.active-panel .who .dot{width:14px;height:14px;border-radius:50%}
.hero{font-family:var(--f-display);font-weight:900;font-size:clamp(84px,14vw,148px);line-height:.82;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.hero small{font-size:.32em;font-weight:700;color:var(--muted);letter-spacing:.02em;margin-left:6px}
.darts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dslot{border:1px dashed var(--line);border-radius:11px;padding:10px 6px;text-align:center;min-height:62px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.dslot.filled{border-style:solid;background:var(--bg)}
.dslot .v{font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1}
.dslot .k{font-size:12px;color:var(--muted)}
.dslot.d2 .v{color:var(--green-t)}.dslot.d3 .v{color:var(--red-t)}.dslot.miss .v{color:var(--faint)}
.hint{background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:11px 13px;display:flex;flex-direction:column;gap:6px}
.route{display:flex;gap:6px;flex-wrap:wrap}
.route b{font-family:var(--f-display);font-size:22px;font-weight:800;background:var(--panel2);border-radius:8px;padding:3px 10px;line-height:1.1}
.route b.fin{background:var(--green);color:#fff}
.last{color:var(--muted);font-size:14px;min-height:21px}
.last b{color:var(--fg)}
.progress{height:8px;border-radius:5px;background:var(--panel2);overflow:hidden}
.progress span{display:block;height:100%;background:var(--pcol,var(--green));border-radius:5px;transition:width .3s}

/* cricket table */
.ctab{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.ctab th,.ctab td{padding:5px 6px;text-align:center;border-bottom:1px solid var(--line)}
.ctab th{font-family:var(--f-label);font-weight:600;font-size:13px;color:var(--muted);letter-spacing:.05em}
.ctab td.t{font-family:var(--f-display);font-weight:800;font-size:22px;width:56px}
.ctab td.t.dead{color:var(--faint);text-decoration:line-through}
.mk{display:inline-block;width:28px;height:28px;vertical-align:middle}
.ctab td.act{background:var(--tint)}
.tscroll{overflow-x:auto}

/* input */
.input{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.inhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.mods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mods button{border:1px solid var(--line);background:var(--bg);border-radius:11px;padding:12px 6px;font-family:var(--f-display);font-weight:800;font-size:20px;text-transform:uppercase;letter-spacing:.04em}
.mods button[aria-pressed="true"].m1{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.mods button[aria-pressed="true"].m2{background:var(--green);border-color:var(--green);color:#fff}
.mods button[aria-pressed="true"].m3{background:var(--red);border-color:var(--red);color:#fff}
.keys{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.keys button{border:1px solid var(--line);background:var(--panel2);border-radius:11px;padding:0;height:56px;font-family:var(--f-display);font-weight:800;font-size:26px;font-variant-numeric:tabular-nums;transition:background .1s,transform .05s}
.keys button:hover{background:var(--hover)}
.keys button:active{transform:scale(.96)}
.keys button.wide{grid-column:span 2;font-size:20px;text-transform:uppercase;letter-spacing:.03em}
.keys button.bull{background:rgba(31,127,75,.28);border-color:rgba(47,158,95,.5)}
.keys button.miss{color:var(--muted)}
.keys button.undo{color:var(--gold);font-size:18px}
.keys button:disabled{opacity:.35;cursor:default}
.keys button.target{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.boardwrap{display:flex;flex-direction:column;align-items:center;gap:10px}
.board{width:100%;max-width:440px;aspect-ratio:1;touch-action:manipulation;user-select:none}
.board .sg{cursor:pointer;transition:filter .1s}
.board .sg:hover{filter:brightness(1.35)}
.board .sg.tgt{filter:brightness(1.25) drop-shadow(0 0 4px var(--gold))}
.board text{font-family:var(--f-display);font-weight:800;fill:var(--b-light);font-size:22px;pointer-events:none}
.boardrow{display:flex;gap:8px;width:100%;max-width:440px}
.boardrow .btn{flex:1;justify-content:center}

/* overlay & toast */
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 18px);transform:translate(-50%,-20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);font-family:var(--f-display);font-weight:900;font-size:30px;text-transform:uppercase;padding:10px 22px;border-radius:12px;letter-spacing:.03em;transition:opacity .2s,transform .25s;z-index:50;box-shadow:0 18px 40px -12px rgba(0,0,0,.6);max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.red{background:var(--red);color:#fff}.toast.green{background:var(--green);color:#fff}.toast.gold{background:var(--gold);color:#1a1205}
.overlay{position:fixed;inset:0;background:rgba(5,10,8,.72);display:grid;place-items:center;z-index:40;padding:16px;backdrop-filter:blur(3px)}
.dialog{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;max-width:380px;width:100%;display:flex;flex-direction:column;gap:14px}
.dialog h3{margin:0;font-family:var(--f-display);font-size:26px;font-weight:800;text-transform:uppercase}
.dialog .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

/* results */
.result{display:flex;flex-direction:column;gap:20px;align-items:stretch}
.winner{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px 22px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;overflow:hidden}
.winner .crown{font-family:var(--f-label);letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:700}
.winner .wn{font-family:var(--f-display);font-weight:900;font-size:clamp(48px,10vw,92px);line-height:.95;text-transform:uppercase;text-wrap:balance}
.stats{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;min-width:520px}
.stats th,.stats td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line)}
.stats th{font-family:var(--f-label);text-transform:uppercase;letter-spacing:.08em;font-size:12.5px;color:var(--muted);font-weight:600}
.stats td:first-child,.stats th:first-child{text-align:left}
.stats tr.win td{color:var(--gold)}
.foot{color:var(--faint);font-size:13px;text-align:center}
kbd{font-family:var(--f-label);background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:0 5px;font-size:12px}
@media (max-width:520px){
  .keys button{height:50px;font-size:23px}
  .pc .big{font-size:42px}
  .gamehead .title{font-size:28px}
}

/* Summen-Eingabe */
.sumdisp{display:flex;align-items:baseline;justify-content:space-between;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:8px 14px}
.sumdisp b{font-family:var(--f-display);font-weight:900;font-size:46px;line-height:1;font-variant-numeric:tabular-nums}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.quick button{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:8px 0;font-family:var(--f-display);font-weight:800;font-size:20px}
.quick button:hover{background:var(--panel2)}
.keys.numpad{grid-template-columns:repeat(3,1fr)}
.keys button.okbtn{background:var(--green);border-color:var(--green);color:#fff;font-size:22px}
.numin{width:96px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-weight:600}
.numin:focus{border-color:var(--gold);outline:none}
/* Scram-Zahlen */
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{min-width:34px;text-align:center;padding:4px 6px;border-radius:7px;background:var(--panel2);font-family:var(--f-display);font-weight:800;font-size:17px}
.chip.off{opacity:.3;text-decoration:line-through}
/* Doppel-Raster */
.dblgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.dcell{border-radius:9px;padding:6px 4px;text-align:center;background:color-mix(in srgb,var(--green) var(--q),var(--panel2));display:flex;flex-direction:column;gap:1px}
.dcell b{font-family:var(--f-display);font-weight:800;font-size:17px}
.dcell span{font-size:12px;font-variant-numeric:tabular-nums}
.dblgrid-wrap{display:flex;flex-direction:column;gap:6px}
/* Statistik */
.statsview{display:flex;flex-direction:column;gap:16px}
.proflist{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.profbtn{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:11px;padding:8px 14px;display:flex;flex-direction:column;align-items:flex-start;font-weight:700}
.profbtn small{color:var(--muted);font-weight:500;font-size:12px}
.profbtn[aria-selected="true"]{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.profhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.profhead h2{margin-right:auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px}
@media (max-width:480px){.narrow-hide{display:none}}
.kpi{background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi b{font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.chartwrap{position:relative;width:100%;max-width:760px}
.tip[hidden]{display:none}
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .mean{stroke:var(--muted);stroke-width:1;stroke-dasharray:4 4}
.chart .ax{fill:var(--muted);font-size:12px;font-family:var(--f-body)}
.chart .val{fill:var(--fg);font-size:14px;font-weight:700;font-family:var(--f-body)}
.chart .ln{fill:none;stroke:var(--gold);stroke-width:2;stroke-linejoin:round}
.chart .area{fill:var(--gold);opacity:.12}
.chart .dot{fill:var(--panel);stroke:var(--fg);stroke-width:2}
.chart .dot.won{stroke:var(--gold);fill:var(--gold)}
.chart .xhair{stroke:var(--muted);stroke-width:1}
.tip{position:absolute;background:var(--fg);color:var(--bg);border-radius:9px;padding:6px 10px;font-size:12.5px;display:flex;flex-direction:column;pointer-events:none;min-width:130px;box-shadow:0 8px 20px -8px rgba(0,0,0,.6)}
.tip b{font-size:15px}
/* Querformat: Handy quer und Tablet */
@media (orientation:landscape) and (max-height:600px){
  .wrap{padding-block:8px 12px;gap:10px}
  .brand h1{font-size:22px}.brand svg{width:26px;height:26px}
  .gamehead{display:none}
  .strip{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(130px,1fr);overflow-x:auto}
  .pc{padding:6px 10px;gap:2px}.pc .big{font-size:30px}.pc .sub{font-size:12px}
  .play{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:12px}

  dart(g,p,d){
    p.legDarts++;
    if(!p.opened){if(d.m===2){p.opened=true}else return{}}
    const chance=this.dblChance(g,p);if(chance)p.dblDarts++;
    const rest=p.score-val(d),o=g.opts.out;
    const bust=rest<0||(rest===1&&o!=="single")||(rest===0&&o==="double"&&d.m!==2)||(rest===0&&o==="master"&&d.m===1);
    if(bust){p.score=p.turnStart;p.opened=p.turnOpened;return{end:true,bust:true,toast:["Überworfen","red"]}}
    p.score=rest;
    if(rest===0){if(chance)p.dblHits++;return this.legWon(g,p)}
    return{};
  },
  visitInfo(g,p){return{rest:p.score,out:g.opts.out,opened:p.opened}},
  visit(g,p,total,nd,dbl){
    p.legDarts+=nd;p._nd=nd;
    if(!p.opened){if(total>0)p.opened=true;else return{end:true}}
    p.dblDarts+=dbl||0;
    const rest=p.score-total,o=g.opts.out;
    if(rest<0||(rest===1&&o!=="single")){p.score=p.turnStart;p.opened=p.turnOpened;return{end:true,bust:true,toast:["Überworfen","red"]}}
    p.score=rest;
    if(rest===0){if(o==="double")p.dblHits++;return this.legWon(g,p)}
    return{end:true};
  },
  turnEnd(g,p,r){
    const s=r.bust?0:p.turnStart-p.score;p.pts+=s;if(s>p.high)p.high=s;
    if(s===180)p.n180++;else if(s>=140)p.n140++;else if(s>=100)p.n100++;
    if(!r.bust&&!r.toast&&!r.win){if(s===180)r.toast=["180!","gold"];else if(s>=100)r.toast=[String(s),"gold"]}
    const nd=g.turn.length===1&&g.turn[0].tot!=null?(p._nd||3):g.turn.length;
    if((p.legVisit||0)<3){p.f9p+=s;p.f9d+=nd}p.legVisit=(p.legVisit||0)+1;
    if(p.turnOpened&&p.turnStart<=170&&g.opts.out!=="single"&&checkout(p.turnStart,3,g.opts.out)){const b=p.turnStart<=40?0:p.turnStart<=100?1:2;p.coA[b]++;if(p.score===0&&!r.bust)p.coH[b]++}
    return s;
  },
  aim(g,p){return p.opened?aimFinish(p.score,g.opts.out,3-g.turn.length):D2(20)},
  avg:p=>p.darts?(p.pts/p.darts*3):0,
  card(g,p){return{big:p.score,sub:`<span>Ø ${this.avg(p).toFixed(1)}</span><span>${p.darts} Darts</span>${g.opts.sets>1?`<span class="badge gold">Sets ${p.sets}</span>`:""}${!p.opened?'<span class="badge">nicht offen</span>':""}`,legs:g.opts.legs>1}},
  hero(g,p){return{v:p.score,sm:p.opened?"Rest":"Double In"}},
  hint(g,p){return p.opened?finishHint(p.score,g.opts.out,3-g.turn.length):`<span class="label">Zum Öffnen</span><div class="route"><b class="fin">Doppel</b></div>`},
  targets(g,p){if(!p.opened)return{dbl:true};const r=checkout(p.score,3-g.turn.length,g.opts.out);return r?{list:[r[0]]}:{list:[T3(20)]}},
  winners:g=>g.players.filter(p=>g.opts.sets>1?p.sets>=g.opts.sets:p.legs>=g.opts.legs),
  round(g){const s=g.players.reduce((a,q)=>a+q.sets,0),l=g.players.reduce((a,q)=>a+q.legs,0);return`${g.opts.sets>1?`Set ${s+1} · `:""}Leg ${l+1} · Runde ${g.round}`},
  sub:g=>`${g.opts.start} · ${g.opts.in==="double"?"Double In · ":""}${{double:"Double Out",master:"Master Out",single:"Single Out"}[g.opts.out]}${g.opts.sets>1?` · First to ${g.opts.sets} Sets (${g.opts.legs} Legs)`:g.opts.legs>1?" · First to "+g.opts.legs:""}`,
  stats:[["Ø 3 Darts",p=>MODES.x01.avg(p).toFixed(2)],["Höchste",p=>p.high],["180",p=>p.n180],["140+",p=>p.n140],["100+",p=>p.n100],["Checkout",p=>p.dblDarts?Math.round(p.dblHits/p.dblDarts*100)+" %":"–"],["Höchstes Finish",p=>p.hiFin||"–"],["Bestes Leg",p=>p.best?p.best+" D":"–"],["Legs",p=>p.legsTotal]]
},

cricket:{
  name:"Cricket",tag:"Taktik",desc:"15 bis 20 und Bull schließen, Punkte sammeln.",
  rules:"Ziele sind 15–20 und Bull. Drei Treffer (Double zählt zwei, Triple drei) schließen eine Zahl. Weitere Treffer bringen Punkte, solange ein Gegner sie noch offen hat. Bei Cut-Throat bekommen die Gegner die Punkte, wenig ist gut. Wer alles geschlossen hat und vorne liegt, gewinnt.",
  options:[
    {k:"variant",l:"Variante",v:[["standard","Standard"],["cut","Cut-Throat"]],d:"standard"}],
  T:[20,19,18,17,16,15,25],
  init(g){g.players.forEach(p=>{p.marks={};this.T.forEach(t=>p.marks[t]=0);p.score=0;p.totalMarks=0})},
  closedAll(g,t){return g.players.every(q=>q.marks[t]>=3)},
  dart(g,p,d){
    if(!this.T.includes(d.n))return{};
    const hits=d.m,before=p.marks[d.n];
    const add=Math.min(hits,3-before);p.marks[d.n]+=add;p.totalMarks+=hits;const over=hits-add;
    if(over>0){
      const pts=over*d.n;
      if(g.opts.variant==="cut"){g.players.forEach(q=>{if(q!==p&&q.marks[d.n]<3)q.score+=pts})}
      else if(g.players.some(q=>q!==p&&q.marks[d.n]<3))p.score+=pts;
    }
    p.hits++;
    if(this.T.every(t=>p.marks[t]>=3)){
      const others=g.players.filter(q=>q!==p);
      const ok=g.opts.variant==="cut"?others.every(q=>p.score<=q.score):others.every(q=>p.score>=q.score);
      if(ok)return{win:true};
    }
    return{hit:true};
  },
  aim(g,p){
    const open=this.T.filter(t=>!this.closedAll(g,t)),need=open.filter(t=>p.marks[t]<3),score=open.filter(t=>p.marks[t]>=3);
    let t;
    if(g.opts.variant==="cut")t=need.length?need[0]:score[0];
    else{const behind=g.players.some(q=>q!==p&&q.score>p.score);t=(behind||!need.length)&&score.length?score[0]:(need.length?need[0]:score[0])}
    if(t==null)return T3(20);return t===25?BULL:T3(t);
  },
  winners(g){const cut=g.opts.variant==="cut";if(g.winIdx!=null)return[g.players[g.winIdx]];return winnersBy(g,p=>cut?-p.score*1000+p.totalMarks:p.score*1000+p.totalMarks)},
  card(g,p){const closed=this.T.filter(t=>p.marks[t]>=3).length;return{big:p.score,sub:`<span>${closed}/7 zu</span><span>${(p.darts?p.totalMarks/p.darts*3:0).toFixed(1)} MPR</span>`}},
  hero(g,p){return{v:p.score,sm:"Punkte"}},
  board(g){
    const ps=g.players,mk=n=>n===0?"":`<svg class="mk" viewBox="0 0 28 28" aria-label="${n} Treffer"><g stroke="currentColor" stroke-width="3" stroke-linecap="round" fill="none">${n>=1?'<line x1="7" y1="21" x2="21" y2="7"/>':""}${n>=2?'<line x1="7" y1="7" x2="21" y2="21"/>':""}${n>=3?'<circle cx="14" cy="14" r="10.5" stroke-width="2.5"/>':""}</g></svg>`;
    return`<div class="tscroll"><table class="ctab"><thead><tr><th></th>${ps.map(p=>`<th style="color:${p.color}">${esc(p.name)}</th>`).join("")}</tr></thead><tbody>${this.T.map(t=>`<tr><td class="t ${this.closedAll(g,t)?"dead":""}">${t===25?"B":t}</td>${ps.map((p,i)=>`<td class="${i===g.cur?"act":""}" style="color:${p.marks[t]>=3?p.color:"var(--fg)"}">${mk(p.marks[t])}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  },
  hint(g,p){const open=this.T.filter(t=>p.marks[t]<3&&!this.closedAll(g,t));return`<span class="label">Offen für dich</span><div class="route">${open.length?open.map(t=>`<b>${t===25?"Bull":t}</b>`).join(""):"<b class='fin'>Alles zu</b>"}</div>`},
  targets(g){return{nums:this.T.filter(t=>!this.closedAll(g,t))}},
  sub:g=>`${g.opts.variant==="cut"?"Cut-Throat":"Standard"} · ohne Rundenlimit`,
  stats:[["Punkte",p=>p.score],["Marks",p=>p.totalMarks],["MPR",p=>(p.darts?p.totalMarks/p.darts*3:0).toFixed(2)],["Zu",p=>MODES.cricket.T.filter(t=>p.marks[t]>=3).length+"/7"]]
},

atc:{
  name:"Around the Clock",tag:"Training",desc:"1 bis 20 und Bull der Reihe nach treffen.",
  rules:"Triff die Zahlen der Reihe nach von 1 bis 20, am Ende das Bull. Wer zuerst durch ist, gewinnt. Mit „Sprung“ bringt ein Double zwei Felder weiter und ein Triple drei. Mit „Nur Doppel“ zählen nur die Doppelfelder.",
  options:[
    {k:"rule",l:"Regel",v:[["single","Jedes Segment"],["jump","Sprung (D=2, T=3)"],["double","Nur Doppel"],["triple","Nur Triple"]],d:"single"},
    {k:"bull",l:"Bull am Ende",v:[[1,"Ja"],[0,"Nein"]],d:1}],
  seq(g){const s=[];for(let i=1;i<=20;i++)s.push(i);if(g.opts.bull&&g.opts.rule!=="triple")s.push(25);return s},
  init(g){g.players.forEach(p=>{p.idx=0})},

    if(d.n!==t)return{};
    if(r==="double"&&d.m!==2)return{};
    if(r==="triple"&&d.m!==3)return{};
    p.hits++;p.idx=Math.min(s.length,p.idx+(r==="jump"?d.m:1));

    return{hit:true};
  },
  aim(g,p){const t=this.tgt(g,p),r=g.opts.rule;if(t===25)return r==="double"?BULL:{n:25,m:1};return r==="double"?D2(t):r==="triple"?T3(t):S1(t)},
  winners:g=>winnersBy(g,p=>p.idx),
  card(g,p){const s=this.seq(g);const t=this.tgt(g,p);return{big:p.idx>=s.length?"✓":(t===25?"B":t),sub:`<span>${p.idx}/${s.length}</span><span>${p.darts?Math.round(p.hits/p.darts*100):0} % Quote</span>`,prog:p.idx/s.length}},
  hero(g,p){const t=this.tgt(g,p);const pre={double:"D",triple:"T"}[g.opts.rule]||"";return{v:t===25?(pre==="D"?"Bull":"25"):pre+t,sm:"Ziel"}},
  hint(g,p){const s=this.seq(g);return`<span class="label">Fortschritt</span><div class="progress"><span style="width:${p.idx/s.length*100}%"></span></div><div class="last">Danach: ${s.slice(p.idx+1,p.idx+5).map(x=>x===25?"Bull":x).join(" · ")||"Ziel erreicht"}</div>`},
  targets(g,p){const t=this.tgt(g,p);const r=g.opts.rule;return r==="double"?{list:[D2(t)]}:r==="triple"?{list:[T3(t)]}:{nums:[t]}},
  sub:g=>({single:"Jedes Segment",jump:"Mit Sprung",double:"Nur Doppel",triple:"Nur Triple"})[g.opts.rule],
  stats:[["Stand",p=>p.idx],["Treffer",p=>p.hits],["Quote",p=>(p.darts?Math.round(p.hits/p.darts*100):0)+" %"]]
},

killer:{
  name:"Killer",tag:"Party",desc:"Werde Killer und schieß die anderen raus.",
  rules:"Jeder bekommt eine eigene Zahl. Triff dein Doppel, um Killer zu werden. Als Killer kostet jeder Treffer auf das Doppel eines Gegners ihm ein Leben. Triffst du als Killer dein eigenes Doppel, verlierst du selbst eins. Wer zuletzt übrig ist, gewinnt.",
  options:[
    {k:"lives",l:"Leben",v:[[3,"3"],[5,"5"]],d:3},
    {k:"zone",l:"Trefferzone",v:[["double","Doppel"],["any","Ganze Zahl"]],d:"double"}],
  init(g){const nums=ORDER.slice().sort(()=>Math.random()-.5);g.players.forEach((p,i)=>{p.num=nums[i];p.lives=g.opts.lives;p.killer=false;p.kills=0;p.out=false})},
  dart(g,p,d){
    const ok=g.opts.zone==="any"?d.n>0&&d.n!==25:d.m===2&&d.n!==25;if(!ok)return{};

    if(d.n===p.num){
      if(!p.killer){p.killer=true;p.hits++;toast=[p.name+" ist Killer","red"];call="killer"}
      else{p.lives--;toast=["Eigentor","red"];if(p.lives<=0){p.out=true;toast=[p.name+" ist raus","red"];call="out"}}
    }else if(p.killer){
      const q=g.players.find(x=>x.num===d.n&&!x.out);

    const alive=g.players.filter(x=>!x.out);

    return{toast,call};
  },
  aim(g,p){const mk=n=>g.opts.zone==="double"?D2(n):S1(n);if(!p.killer)return mk(p.num);const t=g.players.filter(q=>q!==p&&!q.out).sort((a,b)=>a.lives-b.lives)[0];return mk(t?t.num:p.num)},

  },
  targets(g,p){const ns=p.killer?g.players.filter(q=>q!==p&&!q.out).map(q=>q.num):[p.num];return g.opts.zone==="double"?{list:ns.map(D2)}:{nums:ns}},
  sub:g=>`${g.opts.lives} Leben · ${g.opts.zone==="double"?"Doppel":"ganze Zahl"}`,
  stats:[["Zahl",p=>p.num],["Leben",p=>Math.max(0,p.lives)],["Kills",p=>p.kills],["Treffer",p=>p.hits]],
  minPlayers:2
},

highscore:{

/* ================= State ================= */
function loadCfg(){const c=store.get("oche.cfg",null)||{mode:"x01",opts:{},players:[{name:"Spieler 1",bot:0},{name:"Bot",bot:3}]};if(!MODES[c.mode])c.mode="x01";c.opts=c.opts||{};c.players=(c.players||[]).filter(p=>!p.remote).map(p=>({name:p.name,bot:p.bot|0}));if(!c.players.length)c.players=[{name:"Spieler 1",bot:0}];return c}
let cfg=loadCfg();
let view="setup",g=null,hist=[],mult=1,inputMode=store.get("oche.input","keys"),sound=store.get("oche.sound",IS_APP);
let botTimer=null,caller=(c=>({de:"pro-de",en:"pro-en"})[c]||c)(store.get("oche.caller","pro-en"));
const myToken=(()=>{let t=store.get("oche.token","");if(!t){t=Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-5);store.set("oche.token",t)}return t})();
const net={role:null,peer:null,code:"",epoch:0,conns:{},spect:{},order:[],online:[],host:null,token:myToken,status:"",err:false,lobby:null,canUndo:false,spectate:false,spectCount:0,run:0,pending:new Map(),hb:null,wd:null,lastSeen:0,myName:store.get("oche.myname","")};
const optsFor=(id,c)=>{c=c||cfg;const o={};MODES[id].options.forEach(x=>{const saved=c.opts[id]&&c.opts[id][x.k];const ok=x.v.some(v=>v[0]===saved)||(x.custom&&Number.isInteger(saved)&&saved>=x.custom.min&&saved<=x.custom.max);o[x.k]=ok?saved:x.d});return o};
const isGuest=()=>net.role==="guest";
const guestish=()=>isGuest()||((net.role==="reconnecting"||net.role==="connecting")&&!net.wasHost);
function canInput(p){
  if(!p||net.role==="reconnecting"||net.role==="connecting")return false;
  if(isGuest())return !p.bot&&p.owner===net.token;
  if(p.bot)return false;
  if(!p.owner||p.owner===net.token)return true;
  return !net.conns[p.owner];
}

/* ================= Engine ================= */
function startGame(o){
  const mode=o?o.mode:cfg.mode,M=MODES[mode],list=o?o.players:cfg.players;
  const ps=list.map((p,i)=>({name:(p.name||"").trim()||"Spieler "+(i+1),color:COLORS[i%COLORS.length],bot:p.remote?0:(p.bot|0),owner:p.remote||(net.role==="host"?net.token:null),darts:0,hits:0,turns:0,out:false}));
  g={id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),mode,opts:o?o.opts:optsFor(mode),tour:o&&o.tour||null,fast:!!(o&&o.tour&&ps.every(p=>p.bot)),players:ps,cur:0,start:0,round:1,turn:[],last:null,over:false,winIdx:null,winList:null};
  M.init(g);beginTurn();hist=[];mult=1;sumBuf="";view="game";sayStop();callEv({k:"gameon",name:ps[g.cur].name});callRequire();render();
}
function beginTurn(){g.turn=[];const M=MODES[g.mode];M.begin&&M.begin(g,g.players[g.cur])}
function throwDart(d,pos){
  if(!g||g.over)return;
  hist.push(JSON.stringify(g));if(hist.length>500)hist.shift();
  const M=MODES[g.mode],p=g.players[g.cur];
  p.darts++;g.turn.push({n:d.n,m:d.m,pos:pos||null});
  if(pos&&!p.bot){(p.pos=p.pos||[]).push([Math.round(pos[0]),Math.round(pos[1])]);if(p.pos.length>300)p.pos.shift()}
  click(d);
  const r=M.dart(g,p,d)||{};
  mult=1;
  if(r.win){finishTurn(r,true);return}
  if(r.end||g.turn.length>=3)finishTurn(r,false);
  else{if(r.toast)toast(...r.toast);if(r.call||r.toast)callWord(r);render()}
}
function finishTurn(r,win){
  const M=MODES[g.mode],p=g.players[g.cur];
  p.turns++;
  const ts=M.turnEnd?M.turnEnd(g,p,r):g.turn.reduce((a,d)=>a+val(d),0);
  g.last={name:p.name,color:p.color,darts:g.turn.map(d=>d.tot!=null?{tot:d.tot,n:0,m:0}:{n:d.n,m:d.m,pos:d.pos}),total:ts,bust:!!r.bust};
  if(r.toast)toast(...r.toast);
  callTurn(g,p,r,ts,win);
  if(win){if(r.call==="shanghai")g.shHit=true;if(g.winIdx==null&&["shanghai","cricket","gotcha"].includes(g.mode))g.winIdx=g.cur;endGame();return}
  if(r.newLeg){M.newLeg(g,false);beginTurn();callEv({k:"gameon",name:g.players[g.cur].name});callRequire();render();return}
  if(M.isOver&&M.isOver(g)){endGame();return}
  const n=g.players.length,rel=i=>(i-g.start+n)%n;
  const nx=nextAlive(g,g.cur);
  if(rel(nx)<=rel(g.cur)){g.round++;if(M.roundEnd&&M.roundEnd(g)){endGame();return}}
  g.cur=nx;beginTurn();callRequire();render();
}
/* ---- caller ---- */
function callTurn(g,p,r,ts,win){
  if(g.mode==="x01"){
    if(r.bust)return callEv({k:"bust"});
    if(win)return callEv({k:"gameshot",what:"match",name:p.name});
    if(r.setWon)return callEv({k:"gameshot",what:"set",name:p.name});
    if(r.newLeg)return callEv({k:"gameshot",what:"leg",name:p.name});
    return callEv({k:"score",v:ts});
  }
  if(g.mode==="highscore")return callEv({k:"score",v:ts});
  if(win){if(r.call)callWord(r);return}
  if(r.bust&&!r.call)return callEv({k:"bust"});
  if(r.call||r.toast)callWord(r);
}
function callRequire(){
  if(!g||g.over)return;const p=g.players[g.cur];
  if(g.mode==="x01"&&p.opened&&p.score<=170&&checkout(p.score,3,g.opts.out))callEv({k:"require",v:p.score,name:p.name});
  if(g.mode==="c121"&&p.rest<=170)callEv({k:"require",v:p.rest,name:p.name});
}
function endGame(){
  g.over=true;g.winList=MODES[g.mode].winners(g).map(w=>g.players.indexOf(w));view="result";
  if(net.role!=="guest"){recordGame();tourRecord()}
  render();
  if(g.mode!=="x01"){const w=g.winList.map(i=>g.players[i].name);callEv(w.length===1?{k:"win",name:w[0]}:{k:"draw"})}
}
function undo(){
  if(!hist.length)return;
  const anyHuman=g.players.some(p=>!p.bot);
  if(g.over){unrecordGame(g.id);tourUnrecord()}
  sayStop();do{g=JSON.parse(hist.pop())}while(hist.length&&anyHuman&&g.players[g.cur].bot);
  mult=1;view="game";render();
}
function fillTurn(){if(!g||g.over)return;const c=g.cur,left=3-g.turn.length;for(let i=0;i<left;i++){throwDart({n:0,m:0});if(!g||g.over||g.cur!==c||g.turn.length===0)break}}

/* ---- bot ---- */
function scheduleBot(){
  clearTimeout(botTimer);botTimer=null;
  if(net.role&&net.role!=="host"||view!=="game"||!g||g.over)return;
  const p=g.players[g.cur];if(!p.bot)return;
  botTimer=setTimeout(botThrow,(g.turn.length?800:1300)*(window.OCHE_FAST||(g.fast?0.04:1)));
}
function botThrow(){
  botTimer=null;if(view!=="game"||!g||g.over)return;
  const p=g.players[g.cur];if(!p.bot)return;
  const s=BOTS[p.bot].s,[ax,ay]=aimPoint(MODES[g.mode].aim(g,p));
  const x=ax+s*gauss(),y=ay+s*1.15*gauss();
  const r=Math.hypot(x,y),k=r>215?215/r:1;
  throwDart(hitAt(x,y),[+(x*k).toFixed(1),+(y*k).toFixed(1)]);
}

/* ================= Audio ================= */
let ac=null;
function click(d){if(!sound)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),gn=ac.createGain();o.type="triangle";o.frequency.value=d.n?(d.m===3?520:d.m===2?420:300):150;gn.gain.setValueAtTime(.16,ac.currentTime);gn.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.12);o.connect(gn).connect(ac.destination);o.start();o.stop(ac.currentTime+.13)}catch(e){}}
/* ---- Caller: Profi-Stimme (vorab erzeugte Ansagen), Systemstimme, Publikum, eigene Aufnahmen ---- */
const REC_KEYS=[["s180","180","Wird bei jeder 180 abgespielt"],["gameshot","Game Shot","Wenn ein Leg, Set oder Spiel gewonnen ist"],["bust","Überworfen","Bei Bust"],["gameon","Game On","Zum Spielstart"]];
const CALLERS=[["pro-en","Profi · English"],["pro-de","Profi · Deutsch"],["tts-en","Handystimme · English"],["tts-de","Handystimme · Deutsch"],["off","Aus"]];
let crowdOn=store.get("oche.crowd",true);
function recGet(k){try{return localStorage.getItem("oche.rec."+k)}catch(e){return null}}
function recSet(k,v){try{if(v)localStorage.setItem("oche.rec."+k,v);else localStorage.removeItem("oche.rec."+k);return true}catch(e){return false}}
function audioCtx(){ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume();return ac}
function speakParts(parts,lang){

function horn(delay){

/* Ereignisse: {k:"score",v} {k:"bust"} {k:"require",v,name} {k:"gameshot",what,name} {k:"gameon",name} {k:"win",name} {k:"draw"} {k:"word",clip,de,en} */
function evText(ev,en){
  const W={leg:["das Leg","the leg"],set:["das Set","the set"],match:["das Match","the match"]}[ev.what||"leg"];
  switch(ev.k){
    case"score":return ev.v===180?(en?"One hundred and eighty!":"Hundertachtzig!"):ev.v?String(ev.v):(en?"No score":"Kein Score");
    case"bust":return en?"Bust":"Überworfen";
    case"require":return en?`${ev.name?ev.name+", ":""}you require ${ev.v}`:`${ev.name?ev.name+", ":""}du brauchst ${ev.v}`;
    case"gameshot":return en?`Game shot, and ${W[1]}${ev.name?", "+ev.name:""}!`:`Game shot, und ${W[0]}${ev.name?", "+ev.name:""}!`;
    case"gameon":return en?`${ev.name?ev.name+" to throw first. ":""}Game on!`:`${ev.name?ev.name+" beginnt. ":""}Game on!`;
    case"win":return en?`Game shot! ${ev.name} wins.`:`Game shot! ${ev.name} gewinnt.`;
    case"draw":return en?"It's a draw!":"Unentschieden!";
    case"word":return en?(ev.en||ev.de||""):(ev.de||"");
  }
  return"";
}
function evClips(ev){
  switch(ev.k){
    case"score":return ev.v===180?["s180"]:ev.v?["n"+ev.v]:["noscore"];
    case"bust":return["bust"];
    case"require":return ev.v>=2&&ev.v<=170?["require","n"+ev.v]:null;
    case"gameshot":return["gs_"+(ev.what||"leg")];
    case"gameon":return["gameon"];
    case"win":return["gs_match"];
    case"draw":return["draw"];
    case"word":return ev.clip?[ev.clip]:null;
  }
  return null;
}
function evRecKey(ev){return ev.k==="score"&&ev.v===180?"s180":ev.k==="gameshot"||ev.k==="win"?"gameshot":ev.k==="bust"?"bust":ev.k==="gameon"?"gameon":null}
function playEv(ev){
  if(!ev||caller==="off"||(g&&g.fast&&!g.over))return;
  const en=caller.endsWith("en"),L=en?"en":"de";
  const is180=ev.k==="score"&&ev.v===180;
  if(crowdOn){if(is180){crowd(5,1,1);horn(1.7)}else if(ev.k==="gameshot"||ev.k==="win")crowd(3.5,.8,.7);else if(ev.k==="score"&&ev.v>=140)crowd(2.2,.35,.5)}
  const rk=evRecKey(ev),rec=rk&&recGet(rk);
  if(rec){try{const au=new Audio(rec);au.play().catch(()=>{});return}catch(e){}}
  if(caller.startsWith("pro")){
    const clips=evClips(ev),o=PRO[L];
    if(!clips)return;
    if(o&&o.ready){proPlay(L,clips);return}
    proLoad(L).then(()=>{if(PRO[L].ready)proPlay(L,clips)});
    if(!(o&&o.err))return;

"Alle starten bei 0 und zählen hoch. Wer genau die Zielzahl erreicht, gewinnt. Wer darüber wirft, fällt auf den Stand vor der Aufnahme zurück. Triffst du genau den Punktestand eines Gegners, muss dieser wieder bei 0 anfangen.":"Everyone starts at 0 and counts up. Whoever reaches the target exactly wins. Going over puts you back to your score before the visit. Hit an opponent's exact score and they have to start again from 0.",
"In Runde 1 zählt nur die 1, in Runde 2 nur die 2 usw. Gezählt wird der volle Wert inklusive Multiplikator. Wer in einer Aufnahme Single, Double und Triple der Rundenzahl trifft, wirft einen Shanghai und gewinnt sofort. Sonst gewinnt die höchste Punktzahl.":"In round 1 only the 1 counts, in round 2 only the 2, and so on. The full value including the multiplier counts. Hit single, double and treble of the round number in one visit for a Shanghai and win instantly. Otherwise the highest score wins.",
"Jede Runde gilt einem Doppel, von D1 bis D20 und zum Schluss Bull, zufällig gemischt oder nur die beliebtesten Finish-Doppel. Du hast pro Runde drei Darts. Am Ende siehst du deine Trefferquote für jedes Feld, sie fließt auch in deine Statistik ein.":"Each round targets one double, from D1 to D20 and finally the bull, shuffled or only the most popular finishing doubles. You have three darts per round. At the end you see your hit rate for every field, and it also goes into your stats.",
"Jeder wirft die festgelegte Anzahl Aufnahmen. Alle Punkte werden addiert, die höchste Summe gewinnt. Gut für Scoring-Training auf die T20.":"Everyone throws the set number of visits. All points are added up and the highest total wins. Good for scoring practice on the T20.",
"Du hast 9 Darts (drei Aufnahmen), um das Ziel mit Double Out zu checken. Gelingt es, steigt das Ziel um eins. Sonst bleibt es gleich oder fällt auf den Start zurück, je nach Einstellung. Gewertet wird das höchste geschaffte Ziel.":"You have 9 darts (three visits) to check out the target with double out. If you do, the target goes up by one. Otherwise it stays or drops back to the start, depending on the setting. The highest target reached counts.",
"Nur für zwei Spieler. In Halbzeit 1 ist Spieler 1 der Stopper: Jeder Treffer schließt eine Zahl (1–20 und Bull). Spieler 2 ist der Scorer und sammelt Punkte nur auf offenen Zahlen. Sind alle Zahlen zu, werden die Rollen getauscht. Wer am Ende mehr Punkte hat, gewinnt.":"Two players only. In half 1, player 1 is the stopper: every hit closes a number (1–20 and bull). Player 2 is the scorer and collects points only on open numbers. When all numbers are closed, the roles swap. Whoever has more points at the end wins.",
"Start mit 27 Punkten. Runde für Runde wird ein Doppel angespielt, von D1 bis D20 und zum Schluss Bull. Jeder Treffer bringt den Wert des Doppels. Ohne Treffer in der Aufnahme wird der Wert des Doppels abgezogen. Wer unter null fällt, ist raus.":"Start with 27 points. Round by round you aim at one double, from D1 to D20 and finally the bull. Every hit adds the double's value. With no hit in a visit, the double's value is subtracted. Drop below zero and you are out.",
"Triff die Zahlen der Reihe nach von 1 bis 20, am Ende das Bull. Wer zuerst durch ist, gewinnt. Mit „Sprung“ bringt ein Double zwei Felder weiter und ein Triple drei. Mit „Nur Doppel“ zählen nur die Doppelfelder.":"Hit the numbers in order from 1 to 20, and the bull at the end. First one through wins. With “Jumps”, a double moves you two fields and a treble three. With “Doubles only”, only the double ring counts.",

function tr(t){
  if(lang!=="en"||!t)return t;
  const s=String(t),k=s.trim();if(!k)return s;
  let out=EN[k];
  if(out==null){for(const [re,rp] of EN_PAT){if(re.test(k)){const r=k.replace(re,rp);if(r!==k){out=r;break}}}}
  if(out==null&&/^(Anfänger|Hobby|Kneipe|Liga|Profi|Weltklasse) \((.+)\)$/.test(k))out=k.replace(/^(\S+) /,(m,a)=>tr(a)+" ");
  if(out==null&&k.includes(", ")){const parts=k.split(", ").map(x=>tr(x));const j=parts.join(", ");if(j!==k)out=j}
  if(out==null&&/[.!?] \S/.test(k)){const parts=k.split(/(?<=[.!?]) (?=\S)/);if(parts.length>1){const j=parts.map(x=>tr(x)).join(" ");if(j!==k)out=j}}
  if(out==null&&k.includes(" · ")){const parts=k.split(" · ").map(x=>tr(x));const j=parts.join(" · ");if(j!==k)out=j}
  if(out==null)return s;
  return s.replace(k,out);
}

function translateNode(root){
  if(lang!=="en"||!root)return;
  if(root.nodeType===3){const v=root.nodeValue,t=tr(v);if(t!==v)root.nodeValue=t;return}
  if(root.nodeType!==1||root.closest&&root.closest("script,style"))return;
  ["placeholder","aria-label","title"].forEach(a=>{const v=root.getAttribute&&root.getAttribute(a);if(v){const t=tr(v);if(t!==v)root.setAttribute(a,t)}});
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT|NodeFilter.SHOW_ELEMENT);let n;
  while(n=w.nextNode()){if(n.nodeType===3){const v=n.nodeValue,t=tr(v);if(t!==v)n.nodeValue=t}else ["placeholder","aria-label","title"].forEach(a=>{const v=n.getAttribute(a);if(v){const t=tr(v);if(t!==v)n.setAttribute(a,t)}})}
}

let tour=store.get("oche.tour",null),tourType=store.get("oche.tourtype","ko"),tourConfirm=false;

function tourCreate(){
  const ps=cfg.players.map((p,i)=>({name:(p.name||"").trim()||"Spieler "+(i+1),bot:p.remote?0:(p.bot|0),remote:p.remote||null}));
  if(ps.length<3){toastLocal("Ein Turnier braucht mindestens 3 Spieler","red");return}
  const order=ps.map((_,i)=>i).sort(()=>Math.random()-.5);
  const t={id:Date.now().toString(36),type:tourType,mode:cfg.mode,opts:optsFor(cfg.mode),players:ps,matches:[],created:Date.now(),champion:null};
  if(t.type==="ko"){
    let size=2;while(size<ps.length)size*=2;
    const list=order.concat(Array(size-ps.length).fill(null));
    const rounds=Math.log2(size);let id=0;
    for(let i=0;i<size/2;i++)t.matches.push({id:id++,r:0,k:i,a:list[i],b:list[size-1-i],w:null,score:""});
    for(let r=1;r<rounds;r++)for(let k=0;k<size/2**(r+1);k++)t.matches.push({id:id++,r,k,a:null,b:null,w:null,score:""});
    t.rounds=rounds;
  }else{
    // Rundenplan nach dem Kreisverfahren, damit niemand zweimal hintereinander spielt
    const arr=order.slice();if(arr.length%2)arr.push(null);const n=arr.length;let id=0;
    for(let r=0;r<n-1;r++){for(let i=0;i<n/2;i++){const a=arr[i],b=arr[n-1-i];if(a!=null&&b!=null)t.matches.push({id:id++,r,a,b,w:null,score:""})}arr.splice(1,0,arr.pop())}
  }
  tour=t;tourPropagate();saveTour();render();
}
function tourPropagate(){
  if(!tour)return;
  if(tour.type==="ko"){
    for(let r=0;r<tour.rounds;r++)tour.matches.filter(m=>m.r===r).forEach(m=>{
      if(r>0){const p1=tour.matches.find(x=>x.r===r-1&&x.k===m.k*2),p2=tour.matches.find(x=>x.r===r-1&&x.k===m.k*2+1);
        const a=p1&&p1.w!=null?p1.w:null,b=p2&&p2.w!=null?p2.w:null;if(m.a!==a||m.b!==b){m.a=a;m.b=b;m.w=null;m.score=""}}
      if(r===0&&m.w==null&&m.a!=null&&m.b==null){m.w=m.a;m.score="Freilos"}
    });
    const fin=tour.matches.find(m=>m.r===tour.rounds-1);tour.champion=fin&&fin.w!=null?fin.w:null;
  }else{
    tour.champion=tour.matches.every(m=>m.w!=null)?tourTable()[0].i:null;
  }
  if(tour.champion!=null&&!tour.awarded){tour.awarded=1;const P=tour.players[tour.champion];if(!P.bot&&!P.remote)setTimeout(()=>awardAch(P.name,"tour"),2500)}
}
function tourTable(){
  const rows=tour.players.map((p,i)=>({i,name:p.name,n:0,w:0,d:0,l:0,pts:0,diff:0}));
  tour.matches.forEach(m=>{if(m.w==null)return;const A=rows[m.a],B=rows[m.b];A.n++;B.n++;
    if(m.w===-1){A.d++;B.d++;A.pts++;B.pts++}else{const W=rows[m.w],L=m.w===m.a?B:A;W.w++;L.l++;W.pts+=2}
    const sc=/^(\d+):(\d+)$/.exec(m.score||"");if(sc){A.diff+=sc[1]-sc[2];B.diff+=sc[2]-sc[1]}});
  return rows.sort((x,y)=>y.pts-x.pts||y.w-x.w||y.diff-x.diff||x.name.localeCompare(y.name));
}

const IMPOSSIBLE=new Set([163,166,169,172,173,175,176,178,179]);

function submitSum(total){
  if(!g||g.over)return;
  const M=MODES[g.mode],p=g.players[g.cur];
  if(!canInput(p)||!M.visit)return;
  sumBuf="";
  if(!(total>=0&&total<=180)||IMPOSSIBLE.has(total)){toastLocal(total+" geht mit drei Darts nicht","red");render();return}
  if(g.turn.length){toastLocal("Diese Aufnahme läuft schon mit einzelnen Darts","red");render();return}
  const info=M.visitInfo?M.visitInfo(g,p):null;
  if(!info||!info.opened){doVisit(total,3,0);return}
  const rest=info.rest-total;
  if(rest===0){
    const route=checkout(info.rest,3,info.out);
    if(!route){toastLocal(info.rest+" lässt sich nicht checken","red");render();return}
    askDarts({fin:true,min:route.length,out:info.out,total},(nd,dd)=>doVisit(total,nd,dd));return;
  }
  if(info.out==="double"&&checkout(info.rest,2,"double")){askDarts({fin:false,total},(nd,dd)=>doVisit(total,3,dd));return}
  doVisit(total,3,0);
}

function recordGame(){

      rec.s=g.mode==="c121"?p.best:p.score!=null?p.score:p.idx!=null?p.idx:null}
    if(p.dbl)rec.dbl=p.dbl;
    if(p.pos&&p.pos.length)rec.pos=p.pos.slice(-200);
    rec.sh=!!(g.shHit&&rec.won);
    const e=all[k]=all[k]||{name:p.name.trim(),games:[]};e.name=p.name.trim();e.games.push(rec);if(e.games.length>500)e.games.shift();any=true;
    const fresh=[],D=dailyTask();

function summarize(e){

  ["n180","n140","n100"].forEach(k=>{S[k]=X.reduce((a,r)=>a+(r.x[k]||0),0)});
  S.high=Math.max(0,...X.map(r=>r.x.high||0));S.hiFin=Math.max(0,...X.map(r=>r.x.hiFin||0));
  const bl=X.map(r=>r.x.best).filter(Boolean);S.bestLeg=bl.length?Math.min(...bl):0;
  S.dd=G.reduce((a,r)=>a+((r.x?r.x.dd:r.dd)||0),0);S.dh=G.reduce((a,r)=>a+((r.x?r.x.dh:r.dh)||0),0);

  S.dbl={};G.forEach(r=>{if(r.dbl)for(const k in r.dbl){S.dbl[k]=S.dbl[k]||[0,0];S.dbl[k][0]+=r.dbl[k][0];S.dbl[k][1]+=r.dbl[k][1]}});
  S.h2h={};G.forEach(r=>r.opp.forEach(o=>{const k=o.name+(o.bot?" · Bot":"");const h=S.h2h[k]=S.h2h[k]||{n:0,w:0,l:0};h.n++;if(r.won)h.w++;else if(o.won)h.l++}));
  S.f9p=X.reduce((a,r)=>a+(r.x.f9p||0),0);S.f9d=X.reduce((a,r)=>a+(r.x.f9d||0),0);
  S.coA=[0,0,0];S.coH=[0,0,0];X.forEach(r=>{if(r.x.coA)for(let i=0;i<3;i++){S.coA[i]+=r.x.coA[i];S.coH[i]+=r.x.coH[i]}});

/* ================= Online (PeerJS / WebRTC, ohne eigenen Server) =================
   Sterntopologie: das Host-Handy ist Schiedsrichter und schickt allen den Spielstand.
   Jeder Raum hat eine "Epoche". Fällt der Host weg, beansprucht ein Gast die Raum-ID der
   nächsten Epoche. Der PeerJS-Server vergibt jede ID nur einmal, deshalb gewinnt genau ein Gerät. */
const ROOM_PREFIX="oche-dart-v2-",MAX_PLAYERS=8,MAX_SPECT=16;
const roomId=(code,ep)=>ROOM_PREFIX+code+"-"+ep;
const genCode=()=>Array.from({length:5},()=>"ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[Math.floor(Math.random()*32)]).join("");
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function onlineAvailable(){return typeof window.Peer==="function"}
function setStatus(s,err){net.status=s;net.err=!!err}
function broadcast(m){Object.values(net.conns).forEach(c=>{try{c.open&&c.send(m)}catch(e){}})}
function clearSession(){try{localStorage.removeItem("oche.session")}catch(e){}}
function saveSession(){
  if(net.role==="host")store.set("oche.session",{role:"host",code:net.code,epoch:net.epoch,t:Date.now(),order:net.order,cfg,g:view==="setup"?null:g,view});
  else if(net.role==="guest")store.set("oche.session",{role:"guest",code:net.code,epoch:net.epoch,t:Date.now(),name:net.myName,spectate:net.spectate,lobby:net.lobby,order:net.order,g,view});
}
function syncPayload(){
  return{t:"sync",view,code:net.code,epoch:net.epoch,g:view==="setup"?null:g,
    canUndoFor:g&&!g.over&&g.turn.length?g.players[g.cur].owner:null,
    online:[net.token,...Object.keys(net.conns)],order:net.order.filter(t=>net.conns[t]),spect:Object.keys(net.spect).length,
    tour:tour||null,
    lobby:{mode:cfg.mode,opts:optsFor(cfg.mode),players:cfg.players.map(p=>({name:p.name,bot:p.remote?0:p.bot,remote:p.remote||null}))}};
}
function onPeerError(e){
  if(e&&e.type==="peer-unavailable"){const m=/peer\s+(\S+)/i.exec(e.message||"");const id=m&&m[1];
    if(id&&net.pending.has(id))net.pending.get(id)();else net.pending.forEach(f=>f());return}
  if(e&&["network","server-error","socket-error","socket-closed","disconnected"].includes(e.type)){
    setStatus("Verbindung zum Vermittlungsserver gestört, versuche weiter …",true);
    try{net.peer&&!net.peer.destroyed&&net.peer.reconnect()}catch(x){}
    render();
  }
}
function refuseIncoming(c){c.on("open",()=>{try{c.send({t:"moved",epoch:net.epoch})}catch(e){}setTimeout(()=>{try{c.close()}catch(e){}},400)})}
function ensurePeer(){
  return new Promise((res,rej)=>{
    const old=net.peer;
    if(old&&!old.destroyed&&old.open&&!old.disconnected)return res(old);
    try{old&&old.destroy()}catch(e){}
    const p=new window.Peer({debug:0});net.peer=p;let done=false;
    const t=setTimeout(()=>{if(!done){done=true;try{p.destroy()}catch(e){}rej({type:"timeout"})}},10000);
    p.on("open",()=>{if(!done){done=true;clearTimeout(t);res(p)}});
    p.on("error",e=>{if(!done){done=true;clearTimeout(t);rej(e)}else onPeerError(e)});
    p.on("disconnected",()=>{try{!p.destroyed&&p.reconnect()}catch(e){}});
    p.on("connection",refuseIncoming);
  });
}
function tryConnect(id){
  return new Promise((res,rej)=>{
    let done=false,c=null;
    const fin=(ok,v)=>{if(done)return;done=true;clearTimeout(t);if(net.pending.get(id)===pend)net.pending.delete(id);if(ok)res(v);else{try{c&&c.close()}catch(e){}rej(v)}};
    const pend=()=>fin(false,"unavailable");net.pending.set(id,pend);
    const t=setTimeout(()=>fin(false,"timeout"),7000);
    try{c=net.peer.connect(id,{serialization:"json",reliable:true})}catch(e){fin(false,"error");return}
    c.on("open",()=>fin(true,c));c.on("error",()=>fin(false,"error"));
  });
}

/* ---- Host ---- */
function claimHost(code,ep,opts){
  return new Promise(res=>{
    try{net.peer&&net.peer.destroy()}catch(e){}
    const p=new window.Peer(roomId(code,ep),{debug:0});net.peer=p;let done=false;
    const t=setTimeout(()=>{if(!done){done=true;try{p.destroy()}catch(e){}net.peer=null;res(false)}},12000);
    p.on("open",()=>{if(done)return;done=true;clearTimeout(t);becomeHost(code,ep,opts||{});res(true)});
    p.on("error",e=>{if(!done){done=true;clearTimeout(t);try{p.destroy()}catch(x){}net.peer=null;res(false);return}onPeerError(e)});
    p.on("disconnected",()=>{try{!p.destroyed&&p.reconnect()}catch(e){}});
    p.on("connection",c=>{if(net.role==="host"&&net.peer===p)hostAccept(c);else refuseIncoming(c)});
  });
}
function becomeHost(code,ep,opts){
  net.run++;
  net.role="host";net.wasHost=true;net.code=code;net.epoch=ep;net.conns={};net.spect={};net.host=null;clearInterval(net.wd);
  if(opts.migrate){
    const L=net.lobby;
    if(L)cfg={mode:L.mode,opts:Object.assign({},cfg.opts,{[L.mode]:L.opts}),players:L.players.map(p=>({name:p.name,bot:p.bot|0,remote:p.remote===net.token?null:p.remote}))};
    net.order=(net.order||[]).filter(t=>t!==net.token);hist=[];if(net.tour)tour=net.tour;
    if(view==="lobby")view="setup";
    toastLocal("Der Host ist weg. Du leitest jetzt den Raum.","gold");
    startProbe(code,ep-1);
  }
  if(opts.restore){const s=opts.restore;cfg=s.cfg||cfg;g=s.g||null;view=g?(s.view||"game"):"setup";net.order=s.order||[];hist=[];toastLocal("Raum "+code+" ist wieder offen","green")}
  if(!opts.migrate&&!opts.restore)net.order=[];
  startHeartbeat();setStatus("");render();
}
function hostAccept(c){
  c._seen=Date.now();
  c.on("data",m=>{c._seen=Date.now();if(!m||typeof m!=="object")return;if(m.t==="hello")return onHello(c,m);if(c._token)onHostMsg(c,m)});
  c.on("close",()=>onConnClose(c));
  c.on("error",()=>{});
}
function onHello(c,m){
  const token=String(m.token||c.peer).slice(0,40),name=(String(m.name||"").trim()||"Gast").slice(0,18);
  if(token===net.token){c.close();return}
  const old=net.conns[token];if(old&&old!==c){old._replaced=true;try{old.close()}catch(e){}}
  c._token=token;c._name=name;
  const inLobby=cfg.players.some(p=>p.remote===token);
  const ownsGame=g&&view!=="setup"&&g.players.some(p=>p.owner===token);
  if(view==="setup"&&!m.spectate&&!inLobby&&cfg.players.length<MAX_PLAYERS){
    cfg.players.push({name,bot:0,remote:token});toastLocal(name+" ist beigetreten","green");delete net.spect[token];
  }else if(inLobby||ownsGame){toastLocal(name+" ist wieder da","green");delete net.spect[token]}
  else{
    if(Object.keys(net.spect).length>=MAX_SPECT&&!net.spect[token]){try{c.send({t:"full"})}catch(e){}setTimeout(()=>c.close(),300);return}
    net.spect[token]=name;toastLocal(name+" schaut zu");
  }
  net.conns[token]=c;if(!net.order.includes(token))net.order.push(token);
  render();
}
function onConnClose(c){
  const tk=c._token;if(!tk||net.conns[tk]!==c)return;
  delete net.conns[tk];
  if(c._bye){delete net.spect[tk];net.order=net.order.filter(t=>t!==tk);if(view==="setup")cfg.players=cfg.players.filter(p=>p.remote!==tk)}
  if(!c._replaced)toastLocal((c._name||"Gast")+(c._bye?" hat den Raum verlassen":" ist getrennt"),"red");
  render();
}
function onHostMsg(c,m){
  const tk=c._token;
  if(m.t==="pong")return;
  if(m.t==="bye"){c._bye=true;return}
  if(view!=="game"||!g||g.over)return;
  const p=g.players[g.cur];if(p.owner!==tk||p.bot)return;
  if(m.t==="dart"&&m.d){const n=+m.d.n,mm=+m.d.m;if(!((n>=0&&n<=20)||n===25)||![0,1,2,3].includes(mm))return;throwDart({n,m:n?(n===25?Math.min(mm,2):mm):0},Array.isArray(m.pos)?m.pos.slice(0,2).map(Number):null)}
  else if(m.t==="undo"&&g.turn.length&&hist.length){g=JSON.parse(hist.pop());render()}
  else if(m.t==="fill")fillTurn();
  else if(m.t==="visit"){const M=MODES[g.mode],tot=m.total|0;if(M.visit&&!g.turn.length&&tot>=0&&tot<=180&&!IMPOSSIBLE.has(tot))enterVisit(tot,m.nd|0,m.dd|0)}
}
function startHeartbeat(){
  clearInterval(net.hb);
  net.hb=setInterval(()=>{
    if(net.role!=="host"){clearInterval(net.hb);return}
    const now=Date.now();
    Object.values(net.conns).forEach(c=>{if(now-c._seen>12000){try{c.close()}catch(e){}onConnClose(c)}else{try{c.send({t:"ping"})}catch(e){}}});
  },3000);
}
/* Nach einer Übernahme: lebt der alte Host doch noch (z. B. war nur ein Gast offline), dann gibt dieses Gerät zurück. */
function startProbe(code,oldEp){
  if(oldEp<0)return;
  const until=Date.now()+180000;
  const tick=async()=>{
    if(net.role!=="host"||net.epoch!==oldEp+1||net.code!==code||Date.now()>until)return;
    try{
      const c=await tryConnect(roomId(code,oldEp));
      if(net.role!=="host"||net.epoch!==oldEp+1){c.close();return}
      broadcast({t:"moved",epoch:oldEp});
      clearInterval(net.hb);net.conns={};net.spect={};net.epoch=oldEp;
      attachHost(c);toastLocal("Der ursprüngliche Host ist zurück","gold");return;
    }catch(e){}
    setTimeout(tick,10000);
  };
  setTimeout(tick,8000);
}
async function hostRoom(){
  if(!onlineAvailable()){setStatus("Online-Spiel ist nur in der Android-App verfügbar.",true);render();return}
  net.role="connecting";setStatus("Raum wird erstellt …");render();
  const run=++net.run;
  for(let i=0;i<4&&net.run===run;i++){if(await claimHost(genCode(),0,{}))return}
  if(net.run===run)closeRoom("Raum konnte nicht erstellt werden. Bitte Internetverbindung prüfen.");
}

/* ---- Gast ---- */
function attachHost(c){
  net.host=c;net.role="guest";net.wasHost=false;net.lastSeen=Date.now();
  c.on("data",m=>{net.lastSeen=Date.now();onGuestMsg(m)});
  c.on("close",()=>{if(net.host===c)hostLost()});
  try{c.send({t:"hello",token:net.token,name:net.myName,spectate:net.spectate})}catch(e){}
  clearInterval(net.wd);
  net.wd=setInterval(()=>{if(net.role==="guest"&&Date.now()-net.lastSeen>10000)hostLost()},2000);
  if(view==="setup")view="lobby";
  setStatus("");render();
}
function hostLost(){
  if(net.role!=="guest")return;
  const c=net.host;net.host=null;try{c&&c.close()}catch(e){}
  clearInterval(net.wd);
  net.role="reconnecting";setStatus("Verbindung zum Host unterbrochen. Verbinde neu …",true);render();
  reconnectLoop();
}
async function reconnectLoop(){
  const run=++net.run,start=Date.now();let fails=0;
  while(net.run===run){
    if(Date.now()-start>180000){closeRoom("Verbindung verloren. Der Raum ist nicht mehr erreichbar.");return}
    try{await ensurePeer()}catch(e){setStatus("Keine Internetverbindung. Neuer Versuch …",true);render();await sleep(3000);continue}
    if(net.run!==run)return;
    const eps=[net.epoch,net.epoch+1],res=await Promise.all(eps.map(ep=>tryConnect(roomId(net.code,ep)).then(c=>({ep,c}),r=>({ep,r}))));
    const ok=res.filter(x=>x.c);
    if(net.run!==run){ok.forEach(x=>x.c.close());return}
    if(ok.length){const pick=ok[ok.length-1];ok.forEach(x=>{if(x!==pick)x.c.close()});net.epoch=pick.ep;attachHost(pick.c);toastLocal("Wieder verbunden","green");return}
    fails+=res[0].r==="unavailable"?2:1;
    const order=net.order||[],rank=order.indexOf(net.token);
    const waitFor=2+(rank<0?order.length+1:rank)*2;
    if(fails>=waitFor&&(net.lobby||g)){if(await claimHost(net.code,net.epoch+1,{migrate:true}))return}
    if(net.run!==run)return;
    setStatus(`Verbindung zum Host unterbrochen. Verbinde neu … (${Math.round((Date.now()-start)/1000)} s)`,true);render();
    await sleep(1500);
  }
}
async function joinRoom(code,name,spectate){
  if(!onlineAvailable()){setStatus("Online-Spiel ist nur in der Android-App verfügbar.",true);render();return}
  code=String(code||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
  if(code.length!==5){setStatus("Der Raumcode hat 5 Zeichen.",true);render();return}
  name=(name||"").trim()||"Gast";net.myName=name;store.set("oche.myname",name);
  net.code=code;net.epoch=0;net.spectate=!!spectate;net.lobby=null;net.order=[];
  net.role="connecting";setStatus("Verbinde mit Raum "+code+" …");render();
  const run=++net.run;
  try{await ensurePeer()}catch(e){if(net.run===run)closeRoom("Keine Verbindung zum Vermittlungsserver. Bitte Internet prüfen.");return}
  let timeouts=0;
  for(let ep=0;ep<8&&net.run===run;ep++){
    try{const c=await tryConnect(roomId(code,ep));if(net.run!==run){c.close();return}net.epoch=ep;attachHost(c);return}
    catch(r){if(r==="timeout"&&++timeouts<2)ep--}
  }
  if(net.run===run)closeRoom("Raum "+code+" nicht gefunden. Stimmt der Code?");
}
function onGuestMsg(m){
  if(!m||typeof m!=="object")return;
  if(m.t==="ping"){guestSend({t:"pong"});return}
  if(m.t==="fx"){if(m.toast)toastLocal(...m.toast);if(m.ev)playEv(m.ev);return}
  if(m.t==="full"){closeRoom("Der Raum ist voll.");return}
  if(m.t==="closed"){closeRoom("Der Host hat den Raum geschlossen.");return}
  if(m.t==="moved"){net.epoch=+m.epoch||0;const c=net.host;net.host=null;try{c&&c.close()}catch(e){}clearInterval(net.wd);net.role="reconnecting";setStatus("Raum wechselt den Host …");render();reconnectLoop();return}
  if(m.t==="sync"){
    net.lobby=m.lobby;net.tour=m.tour||null;net.order=m.order||[];net.online=m.online||[];net.epoch=+m.epoch||0;net.spectCount=m.spect|0;
    net.canUndo=m.canUndoFor===net.token;
    if(m.view==="setup"){view="lobby";g=null}else{view=m.view;g=m.g}
    if(g&&g.over)recordGame();
    render();
  }
}
function guestSend(m){try{net.host&&net.host.open&&net.host.send(m)}catch(e){}}
function leaveRoom(){if(isGuest())guestSend({t:"bye"});setTimeout(()=>closeRoom(""),150)}
function closeRoom(msg,notify){
  const wasHost=net.role==="host"||net.wasHost;
  if(net.role==="host"&&notify)broadcast({t:"closed"});
  net.run++;clearInterval(net.hb);clearInterval(net.wd);
  const p=net.peer;setTimeout(()=>{try{p&&p.destroy()}catch(e){}},notify?300:0);
  net.role=null;net.wasHost=false;net.peer=null;net.code="";net.epoch=0;net.conns={};net.spect={};net.host=null;net.lobby=null;net.order=[];net.pending.clear();
  clearSession();
  if(wasHost){cfg.players=cfg.players.filter(p=>!p.remote);if(!cfg.players.length)cfg.players=[{name:"Spieler 1",bot:0}];if(g)g.players.forEach(p=>{p.owner=null})}
  else{cfg=loadCfg();view="setup";g=null}
  setStatus(msg||"",!!msg);if(msg)toastLocal(msg,"red");render();
}

/* Einladungslink: öffnet die Web-Version auf GitHub Pages bzw. die App und tritt dem Raum direkt bei */
const SITE="https://derbenno1208.github.io/oche-darts/";
const inviteLink=code=>SITE+"#join-"+code;
function shareCode(){
  const link=inviteLink(net.code);
  const txt=`Spiel mit mir Darts in Oche! Tippe auf den Link, um meinem Raum beizutreten (geht auch ohne App im Browser):\n${link}\n\nOder in der Oche-App unter „Online“ den Code ${net.code} eingeben.`;
  try{if(window.AndroidTTS&&window.AndroidTTS.share){window.AndroidTTS.share(txt);return}}catch(e){}
  try{if(navigator.share){navigator.share({title:"Oche Darts",text:txt}).catch(()=>{});return}}catch(e){}
  copyLink();
}
function copyLink(){
  const link=inviteLink(net.code);
  try{navigator.clipboard.writeText(link).then(()=>toastLocal("Link kopiert","green"),()=>toastLocal(link))}catch(e){toastLocal(link)}
}
/* Einladung aus Link (#join-CODE) oder aus der App (oche://join/CODE) */
let invite=null;
function takeInvite(code){
  code=String(code||"").toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,5);if(code.length!==5)return;
  if(net.role&&net.code===code)return;
  invite=code;view=view==="game"&&g?view:"setup";tab="online";
  if(net.myName&&!net.role){joinRoom(code,net.myName,false);invite=null;return}
  render();setTimeout(()=>{const n=$("#joinName");n&&n.focus()},50);
}
window.ocheJoin=takeInvite;
function inviteFromHash(){const m=/^#join-([A-Za-z0-9]{5})$/.exec(location.hash||"");if(m){try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}takeInvite(m[1])}}
window.addEventListener("hashchange",inviteFromHash);
/* App wurde geschlossen und wieder geöffnet: laufenden Raum fortsetzen */
function resumeSession(){
  const s=store.get("oche.session",null);
  if(!s||!s.code||!onlineAvailable()||Date.now()-(s.t||0)>7200000){clearSession();return}
  net.code=s.code;net.epoch=s.epoch|0;net.order=s.order||[];
  if(s.role==="guest"){
    net.myName=s.name||net.myName;net.spectate=!!s.spectate;net.lobby=s.lobby||null;g=s.g||null;view=g?(s.view||"game"):"lobby";
    net.role="reconnecting";setStatus("Verbinde wieder mit Raum "+s.code+" …",true);reconnectLoop();
  }else{
    cfg=s.cfg||cfg;g=s.g||null;view=g?(s.view||"game"):"setup";
    net.role="reconnecting";net.wasHost=true;setStatus("Öffne Raum "+s.code+" wieder …",true);restoreHost(s);
  }
}
async function restoreHost(s){
  const run=++net.run,until=Date.now()+75000;
  const firstLocal=(s.cfg&&s.cfg.players||[]).find(p=>!p.remote);
  while(net.run===run&&Date.now()<until){
    // Hat inzwischen ein anderes Gerät übernommen? Dann als Gast zurück.
    try{await ensurePeer();const c=await tryConnect(roomId(s.code,s.epoch+1));if(net.run!==run){c.close();return}
      net.epoch=s.epoch+1;net.myName=firstLocal?firstLocal.name:"Host";net.spectate=!s.g;attachHost(c);toastLocal("Ein anderes Gerät leitet jetzt den Raum","gold");return}catch(e){}
    if(net.run!==run)return;
    if(await claimHost(s.code,s.epoch,{restore:s}))return;
    await sleep(4000);
  }
  if(net.run===run)closeRoom("Raum konnte nicht wiederhergestellt werden.");
}

/* ================= Board SVG ================= */
function arc(r1,r2,a1,a2){const p=(r,a)=>[(r*Math.sin(a*Math.PI/180)).toFixed(2),(-r*Math.cos(a*Math.PI/180)).toFixed(2)];const [x1,y1]=p(r2,a1),[x2,y2]=p(r2,a2),[x3,y3]=p(r1,a2),[x4,y4]=p(r1,a1);return`M${x1} ${y1}A${r2} ${r2} 0 0 1 ${x2} ${y2}L${x3} ${y3}A${r1} ${r1} 0 0 0 ${x4} ${y4}Z`}
function marker(d,i,faded){return d.pos?`<g pointer-events="none" opacity="${faded?.35:1}"><circle cx="${d.pos[0]}" cy="${d.pos[1]}" r="7" fill="var(--gold)" stroke="#000" stroke-width="2"/><text x="${d.pos[0]}" y="${d.pos[1]+4.5}" text-anchor="middle" style="font-size:11px;fill:#000">${i+1}</text></g>`:""}
function boardSVG(tg,turn,last){
  let s=`<svg class="board" id="board" viewBox="-225 -225 450 450" role="img" aria-label="Dartscheibe, tippe auf ein Segment"><circle r="224" fill="var(--b-dark)" data-miss="1" style="cursor:pointer"/><circle r="171" fill="none" stroke="var(--b-wire)" stroke-width=".6"/>`;
  const hl=(n,m)=>tg&&((tg.nums&&tg.nums.includes(n))||(tg.list&&tg.list.some(x=>x.n===n&&x.m===m))||(tg.mult&&tg.mult===m&&n!==25)||(tg.dbl&&m===2));
  ORDER.forEach((n,i)=>{
    const a1=i*18-9,a2=i*18+9,dark=i%2===0;
    const sc=dark?"var(--b-dark)":"var(--b-light)",rc=dark?"var(--b-red)":"var(--b-green)";
    [[R.bo,R.ti,1,sc],[R.ti,R.to,3,rc],[R.to,R.di,1,sc],[R.di,R.do,2,rc]].forEach(([r1,r2,m,c])=>{
      s+=`<path class="sg${hl(n,m)?" tgt":""}" d="${arc(r1,r2,a1,a2)}" fill="${c}" stroke="var(--b-wire)" stroke-width=".5" data-n="${n}" data-m="${m}"/>`});
    const tx=(196*Math.sin(i*18*Math.PI/180)).toFixed(1),ty=(-196*Math.cos(i*18*Math.PI/180)+8).toFixed(1);
    s+=`<text x="${tx}" y="${ty}" text-anchor="middle">${n}</text>`;
  });
  s+=`<circle class="sg${hl(25,1)?" tgt":""}" r="${R.bo}" fill="var(--b-green)" stroke="var(--b-wire)" stroke-width=".5" data-n="25" data-m="1"/><circle class="sg${hl(25,2)?" tgt":""}" r="${R.bi}" fill="var(--b-red)" stroke="var(--b-wire)" stroke-width=".5" data-n="25" data-m="2"/>`;
  if(turn&&turn.length)turn.forEach((d,i)=>{s+=marker(d,i,false)});
  else if(last)last.darts.forEach((d,i)=>{s+=marker(d,i,true)});
  return s+"</svg>";
}
function boardHit(e){
  const svg=$("#board");const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const p=pt.matrixTransform(svg.getScreenCTM().inverse());
  const t=e.target.closest("[data-n],[data-miss]");if(!t)return;
  const pos=[+p.x.toFixed(1),+p.y.toFixed(1)];
  if(t.dataset.miss)input({n:0,m:0},pos);else input({n:+t.dataset.n,m:+t.dataset.m},pos);
}
function input(d,pos){
  if(!g||g.over||!canInput(g.players[g.cur]))return;
  buzz(d.n?(d.m===3?30:18):40);
  if(isGuest()){click(d);mult=1;guestSend({t:"dart",d,pos:pos||null});render();return}
  throwDart(d,pos);
}
